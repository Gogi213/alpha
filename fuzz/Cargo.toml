[package]
name = "alpha-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
alpha = { path = ".." }

# Патч корня не действует в отдельной рабочей области: без этой строки
# собирался hftbacktest с crates.io без правок vendor/ (prof, PartialFill),
# и Fuzz краснел с 06.10 (TK-635).
[patch.crates-io]
hftbacktest = { path = "../vendor/hftbacktest" }

[[bin]]
name = "reader"
path = "fuzz_targets/reader.rs"

# Отдельный крейт вне рабочей области корня: фаззинг собирается только
# nightly-тулчейном в своём джобе (Decision 30) и никогда не касается
# rust-toolchain.toml и боевого пути.
[workspace]
