<script>
(function(){
const INK='#1d1d1b',MUT='#8c8a83',ACC='#cf4a2b',LINE='#e3e1da';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const gm=t=>new Date((t+4*3600)*1000);
const hm=t=>{const d=gm(t);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
const dm=t=>{const d=gm(t);return pad(d.getUTCDate())+'.'+pad(d.getUTCMonth()+1)};
/* без Intl: первый вызов Intl.NumberFormat('ru') грузит данные локали (десятки мс) */
const nf=(v,d=1)=>{let s=v.toFixed(d);const i=s.indexOf('.'),a=i<0?s:s.slice(0,i),f=i<0?'':','+s.slice(i+1);return a.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+f};
const sg=v=>v==null?'—':(v>0?'+':v<0?'−':'')+nf(Math.abs(v),1);
function dur(s){if(s==null)return '—';if(s<1)return nf(s*1000,0)+' мс';if(s<60)return nf(s,s<10?1:0)+' с';if(s<3600)return nf(s/60,s<600?1:0)+' мин';return nf(s/3600,1)+' ч'}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let A=null,R=[],K={},EMPTY={},TOT={},view=[],etag=null;
let st={pair:'all',sort:'size',dir:-1,open:null,mode:'med',hide:false};
let ROWH=42,CHH=349,OVER=3,win={a:0,b:-1};
const CH=new Map(),PEND=new Map();
const at=(a,k)=>a?a[k]:null;
const W=[11,14,11,11,7,7,7,8,12,12];
/* колонки: kk — имя массива ключей сортировки, v — значение для ячейки */
function cols(){
  const o=st.mode==='out',m=st.mode;
  const cnt=(i,t)=>({k:'n'+i,kk:'n'+i,t:'эпизодов<br>'+t,v:r=>r.cnt[i],f:v=>nf(v,0),z:1});
  return [{k:'c',kk:'c',t:'монета',l:1},{k:'p',kk:'p',t:'пара бирж',l:1}].concat(o?[
    {k:'size',kk:'size|out',t:'расхождение<br>p95, bps',v:r=>at(r.pk,1),f:v=>nf(v,1)},
    {k:'max',kk:'max',t:'расхождение<br>макс, bps',v:r=>at(r.pk,2),f:v=>nf(v,1)}
  ]:[
    {k:'size',kk:'size|med',t:'расхождение, bps',span:2,v:r=>at(r.pk,0),f:v=>nf(v,1)}
  ]).concat([cnt(0,'за 1 ч'),cnt(1,'за 4 ч'),cnt(2,'за 6 ч'),cnt(3,'за 1 сут')]).concat(o?[
    {k:'tau',kk:'tau|out',t:'схождение<br>p95',v:r=>at(r.tau,1),f:dur},
    {k:'net',kk:'net|out',t:'после комиссий<br>p95, bps',v:r=>at(r.net,1),f:sg}
  ]:[
    {k:'tau',kk:'tau|med',t:'схождение,<br>медиана',v:r=>at(r.tau,0),f:dur},
    {k:'net',kk:'net|med',t:'после комиссий,<br>bps',v:r=>at(r.net,0),f:sg}
  ]);
}
/* данные пришли: строки, массивы ключей сортировки (один раз), счётчики пустых */
function setData(j){
  A=j;R=[];K={};EMPTY={};TOT={};
  if(!A.rows)return;
  const n=A.rows.length,N=A.names;
  R=A.rows;
  const f=(name,fn,nul)=>{const a=new Float64Array(n);for(let i=0;i<n;i++){const x=fn(R[i]);a[i]=x==null?nul:x}K[name]=a};
  f('n0',r=>r.cnt[0],0);f('n1',r=>r.cnt[1],0);f('n2',r=>r.cnt[2],0);f('n3',r=>r.cnt[3],0);
  f('size|med',r=>at(r.pk,0),-1e9);f('size|out',r=>at(r.pk,1),-1e9);f('max',r=>at(r.pk,2),-1e9);
  f('tau|med',r=>at(r.tau,0),1e12);f('tau|out',r=>at(r.tau,1),1e12);
  f('net|med',r=>at(r.net,0),-1e9);f('net|out',r=>at(r.net,1),-1e9);
  const rank=(name,lab)=>{const L=R.map(lab),idx=R.map((_,i)=>i).sort((x,y)=>L[x]<L[y]?-1:L[x]>L[y]?1:x-y);const a=new Float64Array(n);idx.forEach((i,p)=>a[i]=p);K[name]=a};
  rank('c',r=>r.c);rank('p',r=>N[r.a]+N[r.b]);
  for(let i=0;i<n;i++){const r=R[i];r.i=i;r.k=r.c+'|'+r.a+'|'+r.b;r.pc=r.a+'|'+r.b;r.pl=N[r.a]+' → '+N[r.b];const e=r.cnt[3]===0?1:0;
    EMPTY.all=(EMPTY.all||0)+e;TOT.all=(TOT.all||0)+1;EMPTY[r.pc]=(EMPTY[r.pc]||0)+e;TOT[r.pc]=(TOT[r.pc]||0)+1}
  if(st.open&&!R.some(r=>r.k===st.open))st.open=null;
}
function btn(attr,val,on,t){return '<button '+attr+'="'+val+'" data-t="'+t+'" class="'+(on?'on':'')+'">'+t+'</button>'}
function flt(){
  const pairs=R.length?[...new Set(R.map(r=>r.pc))]:[];
  $('flt').innerHTML=btn('data-p','all',st.pair==='all','Все')+pairs.map(p=>{const[a,b]=p.split('|');return btn('data-p',p,st.pair===p,A.names[a]+' → '+A.names[b])}).join('');
}
function ctl(){
  const key=st.pair==='all'?'all':st.pair,ne=EMPTY[key]||0,tot=TOT[key]||0;
  $('ctl').innerHTML='<div class="g"><span>счёт</span>'+btn('data-m','med',st.mode==='med','медиана')+btn('data-m','out',st.mode==='out','выбросы')+'</div>'
    +'<div class="g">'+btn('data-hide','1',st.hide,'скрыть пустые')+'<span class="cnt">'+(st.hide?'скрыто ':'пустых: ')+ne+' из '+tot+'</span></div>'
    +'<span class="upd">'+(A&&A.t1?'данные по '+hm(A.t1/1000):'')+'</span>';
}
function head(){
  const C=cols();
  $('cg').innerHTML=W.map(w=>'<col style="width:'+w+'%">').join('');
  $('th').innerHTML='<tr>'+C.map(c=>'<th data-k="'+c.k+'" class="'+(c.l?'l ':'')+(c.k===st.sort?'on':'')+'"'+(c.span?' colspan="'+c.span+'"':'')+'><span class="hl">'+c.t+'<i class="ar">'+(c.k===st.sort?(st.dir<0?'↓':'↑'):'')+'</i></span></th>').join('')+'</tr>';
}
/* порядок строк: фильтр пары и «скрыть пустые», сортировка по готовому массиву ключей */
function buildView(){
  const C=cols();let col=C.find(c=>c.k===st.sort);if(!col){st.sort='size';col=C.find(c=>c.k==='size')}
  const ka=K[col.kk],d=st.dir,out=[];
  for(let i=0;i<R.length;i++){const r=R[i];if((st.pair==='all'||r.pc===st.pair)&&!(st.hide&&r.cnt[3]===0))out.push(i)}
  out.sort((x,y)=>{const v=ka[x]-ka[y];return v?v*d:x-y});
  view=out;
}
function rowHtml(r,C){
  if(r._m===st.mode)return r._h;
  const none=r.cnt[3]===0;let s='<tr class="r" data-k="'+esc(r.k)+'"><td class="l c">'+esc(r.c)+'</td><td class="l p">'+r.pl+'</td>';
  for(let j=2;j<C.length;j++){const c=C[j],x=c.v(r),nn=x==null;
    s+='<td'+(c.span?' colspan="'+c.span+'"':'')+(((none||nn)&&!c.z)||(none&&c.z)?' class="none"':'')+'>'+(nn?'—':c.f(x))+'</td>'}
  r._m=st.mode;r._h=s+'</tr>';return r._h;
}
const CHROW='<tr class="ch"><td colspan="10"><div class="lg"><span><i style="border-color:'+ACC+'"></i>Sell, максимум за 3 мин</span><span><i style="border-color:'+INK+'"></i>Buy, минимум за 3 мин</span><span><i style="border-color:'+MUT+';border-top-style:dotted"></i>центр</span></div><div class="cwrap"><canvas id="cv"></canvas><div class="ld" id="ld">загрузка…</div><div id="tip2" style="position:absolute;pointer-events:none;background:#1d1d1b;color:#fff;border-radius:6px;padding:8px 11px;font-size:12.5px;line-height:1.5;white-space:nowrap;opacity:0;z-index:5"></div></div></td></tr>';
const sp=h=>'<tr class="sp"><td colspan="10" style="height:'+h+'px"></td></tr>';
/* рисуем только строки у окна просмотра: над ними и под ними — пустые строки нужной высоты, высота таблицы та же, что у полной */
function paint(){
  const tb=$('tb'),n=view.length,C=cols();
  const oi=st.open?view.findIndex(i=>R[i].k===st.open):-1,ex=oi>=0?CHH:0;
  const y=i=>i*ROWH+(oi>=0&&i>oi?CHH:0);
  const idx=v=>{if(oi<0||v<(oi+1)*ROWH)return Math.floor(v/ROWH);if(v<(oi+1)*ROWH+CHH)return oi;return Math.floor((v-CHH)/ROWH)};
  const top=tb.getBoundingClientRect().top+window.scrollY,s=window.scrollY-top;
  const a=Math.max(0,idx(Math.max(0,s))-OVER),b=Math.min(n-1,idx(Math.max(0,s)+window.innerHeight)+OVER);
  let h='';
  if(n){
    h+=sp(y(a));
    for(let p=a;p<=b;p++){h+=rowHtml(R[view[p]],C);if(p===oi)h+=CHROW}
    h+=sp(n*ROWH+ex-y(b+1));
  }
  tb.innerHTML=h;win={a,b};
  const r0=tb.querySelector('tr.r');
  if(r0){const hh=r0.getBoundingClientRect().height;if(hh>20&&Math.abs(hh-ROWH)>.01){ROWH=hh;paint();return}}
  if(oi>=0){const c=tb.querySelector('tr.ch');if(c){const hh=c.getBoundingClientRect().height;if(hh>100&&Math.abs(hh-CHH)>.5){CHH=hh;paint();return}}drawChart()}
}
let sq=0;
function onScroll(){if(sq)return;sq=requestAnimationFrame(()=>{sq=0;if($('p-a').hidden||!view.length)return;
  const top=$('tb').getBoundingClientRect().top,vt=-top,vb=-top+window.innerHeight;
  const a=win.a*ROWH,b=(win.b+1)*ROWH+(st.open?CHH:0);   // грубо: окно рисованных строк по высоте
  if((vt<a+3*ROWH&&win.a>0)||(vb>b-3*ROWH&&win.b<view.length-1))paint()})}
function refresh(){buildView();paint()}
/* график пары: ряды берутся с сервера по клику (или при наведении) и держатся в памяти */
function chartKey(r){return A.gen+'|'+r.k}
function fetchChart(r){
  const k=chartKey(r);if(CH.has(k))return Promise.resolve(CH.get(k));
  if(PEND.has(k))return PEND.get(k);
  const p=fetch('/api/arb/chart?c='+encodeURIComponent(r.c)+'&a='+r.a+'&b='+r.b).then(x=>x.json()).then(j=>{if(j.error)throw new Error(j.error);if(CH.size>60)CH.delete(CH.keys().next().value);CH.set(k,j);PEND.delete(k);return j}).catch(e=>{PEND.delete(k);throw e});
  PEND.set(k,p);return p;
}
function drawChart(){
  const k=st.open,r=k&&R.find(x=>x.k===k),cv=$('cv');if(!r||!cv)return;
  const d=CH.get(chartKey(r));
  if(!d){fetchChart(r).then(()=>{if(st.open===k)drawChart()}).catch(()=>{const l=$('ld');if(l)l.textContent='график не получен'});return}
  const l=$('ld');if(l)l.hidden=true;
  const W=cv.parentNode.clientWidth,H=300,dpr=window.devicePixelRatio||1;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.font='12px system-ui,Segoe UI,Arial';
  const L=46,Rr=10,T=8,B=24,pw=W-L-Rr,ph=H-T-B,t0=d.t0/1000,t1=d.t1/1000,step=d.slot,n=d.S.length;
  let lo=1e9,hi=-1e9;
  [d.S,d.B,d.C].forEach(a=>a.forEach(v=>{if(v!=null){lo=Math.min(lo,v/10);hi=Math.max(hi,v/10)}}));
  if(lo>hi){lo=-1;hi=1}
  const pdv=(hi-lo)*.06||1;lo-=pdv;hi+=pdv;
  const X=i=>L+(i+.5)*step/(t1-t0)*pw,Y=v=>T+ph-(v-lo)/(hi-lo)*ph;
  c.strokeStyle=LINE;c.fillStyle=MUT;c.lineWidth=1;c.textAlign='right';
  const spn=hi-lo,raw=spn/5,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,tk=(m<1.5?1:m<3?2:m<7?5:10)*p;
  for(let v=Math.ceil(lo/tk)*tk;v<=hi;v+=tk){const y=Y(v);c.beginPath();c.moveTo(L,y);c.lineTo(W-Rr,y);c.stroke();c.fillText((v<0?'−':'')+nf(Math.abs(v),tk<1?1:0),L-6,y+4)}
  if(lo<0&&hi>0){c.strokeStyle=MUT;c.beginPath();c.moveTo(L,Y(0));c.lineTo(W-Rr,Y(0));c.stroke()}
  const long=t1-t0>20*3600,lab=t=>long?dm(t)+' '+hm(t):hm(t);
  c.fillStyle=MUT;for(let i=0;i<=4;i++){c.textAlign=i===0?'left':i===4?'right':'center';c.fillText(lab(t0+(t1-t0)*i/4),L+pw*i/4,H-7)}
  const line=(a,col,w,dash)=>{c.save();c.strokeStyle=col;c.lineWidth=w;c.setLineDash(dash||[]);c.beginPath();let on=false;a.forEach((v,i)=>{if(v==null){on=false;return}const x=X(i),y=Y(v/10);if(!on){c.moveTo(x,y);on=true}else c.lineTo(x,y)});c.stroke();c.restore()};
  line(d.C,MUT,1,[2,3]);line(d.B,INK,1.5);line(d.S,ACC,1.5);
  const tip=$('tip2');
  cv.onmousemove=e=>{const rc=cv.getBoundingClientRect(),x=e.clientX-rc.left;let i=Math.round((x-L)/pw*(t1-t0)/step-.5);i=Math.max(0,Math.min(n-1,i));
    if(d.S[i]==null){tip.style.opacity=0;return}
    tip.innerHTML='<b>'+(long?dm(t0+i*step)+' ':'')+hm(t0+i*step)+'</b><br>Sell макс '+sg(d.S[i]/10)+'<br>Buy мин '+sg(d.B[i]/10)+(d.C[i]==null?'':'<br>центр '+sg(d.C[i]/10));
    tip.style.opacity=1;const w=tip.offsetWidth,cx=Math.min(Math.max(X(i)-w/2,0),rc.width-w);tip.style.left=cx+'px';tip.style.top=(Y(d.S[i]/10)>ph/2?T+4:ph-60)+'px'};
  cv.onmouseleave=()=>tip.style.opacity=0;
}
function show(){
  const pend=$('pend'),has=A&&!A.pending&&A.rows;
  $('tab').hidden=!has;pend.hidden=!!has;
  if(!has)pend.textContent=A&&A.pending?'Статистика считается — первая выдача появится в течение часа.':'Нет связи с сервером.';
}
/* опрос: только когда может появиться новое (проход раз в period секунд), с ETag; в скрытой вкладке и скрытой странице — нет */
let pollT=0,back=15,skew=0;
function schedule(changed){
  clearTimeout(pollT);if($('p-a').hidden||document.hidden)return;
  const per=(A&&A.period)||300;
  if(changed)back=15;else back=Math.min(back*2,per);
  let wait=back*1000;
  if(changed&&A&&A.written){const due=A.written+per*1000+3000-(Date.now()+skew);wait=Math.max(due,2000)}
  pollT=setTimeout(load,wait);
}
async function load(){
  clearTimeout(pollT);
  if($('p-a').hidden||document.hidden)return;
  let changed=false;
  try{
    const r=await fetch('/api/arb');const et=r.headers.get('etag'),dt=Date.parse(r.headers.get('date')||'');
    if(dt)skew=dt-Date.now();
    if(!(A&&et&&et===etag)){
      performance.mark('arb-resp');const j=await r.json();etag=et;changed=true;performance.mark('arb-json');
      setData(j);performance.mark('arb-setdata');show();flt();ctl();head();if(R.length)refresh();performance.mark('arb-painted')
    }
  }catch(e){if(!A){A={};show()}}
  schedule(changed);
}
function clk(){const t=Date.now()/1000;$('clock').textContent=dm(t)+' · '+hm(t)}
function tab(a,keep){$('p-a').hidden=!a;$('p-h').hidden=a;$('tab-a').classList.toggle('on',a);$('tab-h').classList.toggle('on',!a);
  if(!keep)history.replaceState(null,'',a?'#arb':'#health');
  clk();
  if(a){load();if(st.open)paint()}else if(window.load)window.load()}
$('tab-a').onclick=()=>tab(true);$('tab-h').onclick=()=>tab(false);
/* делегирование: один обработчик на панель, на заголовок и на тело таблицы */
$('flt').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.pair=b.dataset.p;st.open=null;flt();ctl();refresh()};
$('ctl').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.m){st.mode=b.dataset.m;if(!cols().some(c=>c.k===st.sort))st.sort='size'}else st.hide=!st.hide;
  ctl();head();refresh()};
$('th').onclick=e=>{const h=e.target.closest('th');if(!h)return;const k=h.dataset.k;if(st.sort===k)st.dir*=-1;else{st.sort=k;st.dir=(k==='c'||k==='p'||k==='tau')?1:-1}head();refresh()};
let hv=0;
$('tb').onclick=e=>{const tr=e.target.closest('tr.r');if(!tr)return;const k=tr.dataset.k;st.open=st.open===k?null:k;paint();if(st.open){const cv=$('cv');if(cv)cv.scrollIntoView({block:'nearest'})}};
$('tb').onmouseover=e=>{const tr=e.target.closest('tr.r');if(!tr)return;clearTimeout(hv);const k=tr.dataset.k;hv=setTimeout(()=>{const r=R.find(x=>x.k===k);if(r)fetchChart(r).catch(()=>{})},150)};
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',()=>{if(!$('p-a').hidden&&view.length)paint()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(pollT);else{clk();if(!$('p-a').hidden)load();else if(window.load)window.load()}});
setInterval(()=>{if(!document.hidden)clk()},30000);
flt();ctl();head();
if(/^#(health|.*tip=)/.test(location.hash))tab(false,true);else tab(true,true);
window._arb={st,cols,paint,refresh,setData,buildView,head,get view(){return view},get rows(){return R}};
})();
</script>
