<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сбор данных</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* плотный стиль по Spreader (app.spreader.sh): токены и размеры сняты из его app.css, тёмная тема; шрифты Geist / Geist Mono (SIL OFL) */
@font-face{font-family:"Geist";font-style:normal;font-weight:100 900;font-display:block;src:url(/fonts/geist-cyrillic-wght-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Geist";font-style:normal;font-weight:100 900;font-display:block;src:url(/fonts/geist-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Geist Mono";font-style:normal;font-weight:100 900;font-display:block;src:url(/fonts/geist-mono-cyrillic-wght-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Geist Mono";font-style:normal;font-weight:100 900;font-display:block;src:url(/fonts/geist-mono-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{color-scheme:dark;
--background:#0d1013;--foreground:#e9ebee;--card:#13161a;--popover:#13161a;--muted:#1c2024;--accent:#1c2024;--muted-foreground:#a3aab2;
--border:#262b31;--input:#5c646e;--ring:#c9cfd6;--info:#6faeef;
--positive:#34b3a2;--negative:#f0784f;--destructive:#f2666a;--on-bg:#34b3a21a;--on-line:#34b3a2cc;
--radius-sm:2px;--radius-md:4px;--radius-lg:6px;
--font-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--sell:var(--negative);--buy:var(--positive);--ok:var(--positive);--bad:var(--destructive);--nolog:var(--input);--grid:var(--border)}
*{box-sizing:border-box}
html{overflow-y:scroll;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
body{margin:0;background:var(--background);color:var(--foreground);font:12px/16px var(--font-sans);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
:where(button):focus-visible{outline:2px solid var(--ring);outline-offset:1px}
/* шапка (как topbar Spreader: 44 px, линия снизу) + сегмент-переключатель */
.top{display:flex;align-items:center;gap:12px;height:44px;padding:0 16px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.top h1{font-size:13px;line-height:16px;font-weight:600;margin:0;letter-spacing:.01em}
.top .t{margin-left:auto;color:var(--muted-foreground);font:400 11px/16px var(--font-mono)}
#p-a,#p-h{padding:0 16px 16px}
.tabs{display:inline-flex;align-items:center;gap:2px;height:28px;padding:2px;border-radius:14px;background:var(--muted)}
.tabs button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;height:24px;min-width:24px;padding:0 10px;border-radius:9999px;font:500 12px/16px var(--font-sans);color:var(--muted-foreground)}
.tabs button:hover{color:var(--foreground)}
.tabs button.on{color:var(--foreground);background:color-mix(in oklab,var(--input) 30%,transparent);box-shadow:inset 0 0 0 1px var(--input),0 1px 2px #0000000d}
.tabs button:focus-visible,.tg button:focus-visible,.ex button:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
/* биржи: чипы с множественным выбором в верхней панели, 24 px, кольцо вместо рамки (размер не меняется); включённая — зелёный фон 10 % и кольцо 80 %; последние две включённые — без отклика (минимум 2) */
.ex{display:flex;align-items:center;gap:4px;margin-left:4px;flex:none}
.ex button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;height:24px;padding:0 8px;border-radius:9999px;font:500 12px/16px var(--font-sans);color:var(--muted-foreground);box-shadow:inset 0 0 0 1px var(--input)}
.ex button:not([aria-disabled=true]):hover{color:var(--foreground);box-shadow:inset 0 0 0 1px var(--muted-foreground)}
.ex button.on{color:var(--foreground);background:var(--on-bg);box-shadow:inset 0 0 0 1px var(--on-line)}
.ex button[aria-disabled=true]{cursor:default}
.ctl{display:flex;gap:12px;margin:0 0 8px;align-items:center;height:28px}
.ctl .g{display:flex;align-items:center;gap:8px}
.ctl .g>span{color:var(--muted-foreground);font-size:11px;line-height:14px}
.ctl .g .grp{display:inline-flex;gap:2px;height:28px;padding:2px;border-radius:14px;background:var(--muted)}
.ctl .cnt{display:inline-block;width:144px;color:var(--muted-foreground);font:400 11px/14px var(--font-mono);white-space:nowrap}
.ctl .upd{color:var(--muted-foreground);font:400 11px/14px var(--font-mono);white-space:nowrap}
.tg button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;height:28px;padding:0 8px;border-radius:9999px;color:var(--muted-foreground);font:500 12px/16px var(--font-sans)}
.ctl .solo{box-shadow:inset 0 0 0 1px var(--input)}
.ctl .solo:hover{color:var(--foreground);box-shadow:inset 0 0 0 1px var(--muted-foreground)}
.ctl .solo.on{color:var(--foreground);background:var(--on-bg);box-shadow:inset 0 0 0 1px var(--on-line)}
.ctl .grp button{height:24px;min-width:24px;padding:0 10px}
.ctl .grp button:hover{color:var(--foreground)}
.ctl .grp button.on{color:var(--foreground);background:color-mix(in oklab,var(--input) 30%,transparent);box-shadow:inset 0 0 0 1px var(--input),0 1px 2px #0000000d}
.ctl .solo{padding:0 10px}
/* «Настройки»: кнопка и поповер как «Колонки» у Spreader (отступ 12, зазор 10, радиус 24, кольцо 1 px белым 10 %, галочка 16 px); число действующих фильтров — значок поверх кнопки (ширина кнопки не меняется) */
.ctl .cols-btn{margin-left:auto;gap:6px;padding:0 10px;position:relative}
.ctl .cols-btn .bd{position:absolute;top:-5px;right:-5px;min-width:14px;height:14px;padding:0 4px;border-radius:7px;background:var(--positive);color:var(--background);font:600 10px/14px var(--font-mono);text-align:center}
.ctl .cols-btn svg{width:14px;height:14px;flex:none}
.ctl .cols-btn[aria-expanded=true]{color:var(--foreground);background:var(--on-bg);box-shadow:inset 0 0 0 1px var(--on-line)}
#colpop{position:absolute;z-index:50;width:288px;max-height:calc(100vh - 80px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;padding:12px;display:grid;gap:10px;background:var(--card);color:var(--foreground);border-radius:24px;box-shadow:0 0 0 1px #ffffff1a,0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a;font:400 12px/16px var(--font-sans)}
#colpop header{display:grid;gap:4px}
#colpop h4{margin:0;font-size:14px;line-height:20px;font-weight:500}
#colpop p{margin:0;color:var(--muted-foreground)}
#colpop .list{display:grid;gap:7px}
#colpop h5{margin:0;font:500 11px/14px var(--font-sans);color:var(--muted-foreground);letter-spacing:.02em}
#colpop section{display:grid;gap:8px}
#colpop .flt{display:grid;gap:6px}
#colpop .fr{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:500;line-height:16px}
#colpop .fr input[type=text]{width:64px;height:24px;padding:0 8px;border:0;border-radius:var(--radius-md);background:var(--muted);color:var(--foreground);box-shadow:inset 0 0 0 1px var(--border);font:400 12px/16px var(--font-mono);text-align:right;outline:none}
#colpop .fr input[type=text]::placeholder{color:var(--muted-foreground);opacity:.6}
#colpop .fr input[type=text]:focus-visible{box-shadow:inset 0 0 0 1px var(--ring)}
#colpop .fr input[type=text].bad{box-shadow:inset 0 0 0 1px var(--destructive)}
#colpop label.lab{display:flex;align-items:center;gap:8px;font-weight:500;line-height:12px;cursor:pointer;user-select:none}
#colpop label.lab.fx{cursor:default}
#colpop input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:16px;height:16px;margin:0;border-radius:5px;border:1px solid color-mix(in oklab,var(--input) 90%,transparent);background:color-mix(in oklab,var(--input) 90%,transparent) center/12px no-repeat;cursor:inherit}
#colpop input[type=checkbox]:checked{border-color:var(--positive);background-color:var(--positive);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230d1013' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>")}
#colpop input[type=checkbox]:disabled{opacity:.5}
#colpop input[type=checkbox]:focus-visible,#colpop footer button:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
#colpop footer{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
#colpop footer .h{display:grid}
#colpop .h{font-size:11px;line-height:14px;color:var(--muted-foreground)}
#colpop footer button{all:unset;box-sizing:border-box;cursor:pointer;height:24px;padding:0 8px;border-radius:9999px;box-shadow:inset 0 0 0 1px var(--border);font:500 12px/16px var(--font-sans);display:inline-flex;align-items:center}
#colpop footer button:hover:not(:disabled){background:var(--muted)}
#colpop footer button:disabled{opacity:.5;cursor:default}
/* таблица (sp-dt): заголовок 11 px muted, строка 28 px, числа — Geist Mono tabular, разделитель строк — border 70 % */
.tw{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);overflow:hidden;min-width:480px;max-width:100%}
table.a{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
table.a th{font-weight:500;font-size:11px;line-height:13px;letter-spacing:.01em;color:var(--muted-foreground);text-align:right;vertical-align:bottom;height:60px;padding:0 6px 6px;cursor:pointer;white-space:normal;user-select:none;background:var(--card);border-bottom:1px solid var(--border)}
table.a thead tr:first-child th:first-child,table.a td:first-child{padding-left:12px}
table.a thead tr:first-child th:last-child,table.a td:last-child{padding-right:12px}
table.a th.l,table.a td.l{text-align:left}
table.a th:hover,table.a th.on{color:var(--foreground)}
table.a td i.un{display:inline-block;width:22px;margin-left:4px;text-align:left;font-style:normal;color:var(--muted-foreground);font-family:var(--font-mono);font-size:11px}
.hl{position:relative;display:inline-block}
.hl .ar{position:absolute;left:100%;bottom:0;margin-left:3px;font-style:normal;font-size:10px;color:var(--foreground)}
table.a td{padding:0 6px;height:28px;text-align:right;border-bottom:1px solid color-mix(in oklab,var(--border) 70%,transparent);font:400 12px/16px var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card)}
table.a td.l{font-family:var(--font-sans)}
table.a tr.r{cursor:pointer}
table.a tr.r:hover td{background:var(--muted)}
table.a tr.r:has(+tr.ch) td{background:color-mix(in oklab,var(--muted) 60%,var(--card))}
table.a tr.r:has(+tr.ch) td:first-child{box-shadow:inset 2px 0 0 var(--info)}
table.a td.c{font-weight:600;letter-spacing:.01em;color:var(--foreground)}
table.a td.p{color:var(--muted-foreground);font-size:11px}
table.a td.z{color:var(--muted-foreground)}
table.a td.none{color:var(--muted-foreground);opacity:.55}
table.a td.pos{color:var(--positive)}
table.a tr.ch td{padding:0;height:auto;background:var(--background)!important;cursor:default;overflow:visible;border-bottom:1px solid var(--border)}
table.a tr.ch .box{margin:0;padding:8px 12px 6px}
table.a tr.sp td{padding:0;border:0;line-height:0;font-size:0;cursor:default;background:transparent}
.cwrap{position:relative;height:260px}
.cwrap canvas{display:block;width:100%;height:260px}
.cwrap .ld{position:absolute;left:0;top:112px;width:100%;text-align:center;color:var(--muted-foreground);font-size:11px}
.lg{display:flex;gap:12px;font-size:11px;line-height:14px;color:var(--muted-foreground);margin:0 0 4px;height:14px;white-space:nowrap;align-items:center}
.lg i{display:inline-block;width:12px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.lg b{display:inline-block;width:12px;height:8px;vertical-align:middle;margin-right:5px;border-radius:2px}
.pend{color:var(--muted-foreground);font-size:12px;padding:16px 0}
/* подсказка (sp-tip): Geist Mono 11/16, строка «подпись — значение» */
.pop{position:absolute;pointer-events:none;background:var(--popover);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius-md);padding:6px 9px;font:400 11px/16px var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;opacity:0;z-index:5;box-shadow:0 4px 14px #0000002e}
.pop>div{display:flex;justify-content:space-between;gap:14px}
.pop>div>span{color:var(--muted-foreground)}
.pop>div>b{font-weight:500}
.pop .tt{color:var(--muted-foreground);margin-bottom:2px}
.pop .a{color:var(--negative)}.pop .m{color:var(--muted-foreground)}
#tip{transform:translate(-50%,0)}
/* подсказка к заголовку столбца и к метке «снимки» (текст, без баннеров) */
#htip{max-width:264px;white-space:normal;font:400 11px/15px var(--font-sans);padding:7px 9px;z-index:60;transition:opacity .08s}
table.a td i.sn{display:inline-block;margin-left:5px;padding:0 5px;border-radius:9999px;box-shadow:inset 0 0 0 1px var(--input);font:500 10px/14px var(--font-sans);font-style:normal;color:var(--muted-foreground);vertical-align:1px}
/* вкладка «Здоровье» — те же токены */
.cap{text-align:right;color:var(--muted-foreground);font-size:11px;line-height:14px;margin:0 0 2px;padding-right:18px}
.row{padding:0 0 10px;outline:none;cursor:pointer;position:relative}
.row .hd{display:flex;align-items:center;height:28px;gap:8px}
.nm{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.01em;min-width:80px}.nm.sm{font-size:12px;font-weight:500;color:var(--muted-foreground);margin-left:22px}
.mk{flex:none}
.val{margin-left:auto;display:flex;align-items:baseline;gap:4px}
.v{font:500 15px/20px var(--font-mono);color:var(--muted-foreground)}.v.bad{color:var(--destructive)}
.u{font-size:11px;line-height:14px;color:var(--muted-foreground)}
.chev{color:var(--muted-foreground);font-size:14px;line-height:1;width:12px;text-align:center;transition:transform .15s;margin-left:6px}
.net .chev{margin-left:auto}
.row:hover .chev,.row:focus-visible .chev{color:var(--foreground)}
.row.open .chev{transform:rotate(90deg)}
.st svg{display:block}
.row.net{margin-top:6px;padding-top:10px;border-top:1px solid var(--border)}
.detail{display:none;margin:8px 0 2px 22px;padding:10px 12px;background:color-mix(in oklab,var(--muted) 45%,var(--card));border:1px solid var(--border);border-radius:var(--radius-lg);cursor:default}
.row.open .detail{display:block}
dl{margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px 20px}
dt{font-size:10px;line-height:13px;color:var(--muted-foreground)}dd{margin:1px 0 0;font-size:12px;line-height:16px}
.detail table{border-collapse:collapse;width:480px;max-width:100%}
.detail th{font-weight:500;font-size:10px;line-height:13px;color:var(--muted-foreground);text-align:right;padding:2px 8px 4px}
.detail td{padding:3px 8px;text-align:right;font-size:12px;line-height:16px}.detail td:first-child,.detail th:first-child{text-align:left;padding-left:0}
.b{cursor:pointer}.b:hover{opacity:.7}
.wrap{position:relative}
</style>
</head>
<body>
<div class="top"><h1>Сбор данных</h1><nav class="tabs"><button id="tab-a" data-t="Арбитраж" class="on">Арбитраж</button><button id="tab-h" data-t="Здоровье">Здоровье</button></nav><div class="ex" id="ex" role="group" aria-label="Биржи"></div><div class="t" id="clock"></div></div>
<section id="p-h" hidden>
<div class="cap">потеряно за час</div>
<div class="wrap" id="wrap"><div id="tip" class="pop"></div><div id="rows"></div><div class="axis" id="axis"></div></div>
</section>

<section id="p-a">
<div class="ctl tg" id="ctl"></div>
<div class="pend" id="pend" hidden></div>
<div class="tw" id="tw"><table class="a" id="tab"><colgroup id="cg"></colgroup><thead id="th"></thead><tbody id="tb"></tbody></table></div>
</section>
<div id="colpop" hidden role="dialog" aria-label="Настройки"></div>
<div id="htip" class="pop" role="tooltip"></div>

<script>
const cv0=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ACC=cv0('--bad'),OKC=cv0('--ok'),NOLOG=cv0('--nolog'),INK=cv0('--foreground'),MUT=cv0('--muted-foreground'),CELLC=cv0('--grid');
let D=null,open=new Set(),W=1344;
const wrap=document.getElementById('wrap'),rowsEl=document.getElementById('rows'),axisEl=document.getElementById('axis'),tip=document.getElementById('tip'),clock=document.getElementById('clock');
const pad=n=>String(n).padStart(2,'0');
const gm=t=>new Date((t+4*3600)*1000);
const hm=t=>{const d=gm(t);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
const f1=v=>String(Math.round(v*10)/10).replace('.',',');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function bars(id,arr){
  const n=arr.length,pitch=W/n,bw=pitch-3,h=20;
  let o='<svg width="'+W+'" height="'+h+'" viewBox="0 0 '+W+' '+h+'" xmlns="http://www.w3.org/2000/svg">';
  arr.forEach((b,k)=>{const x=k*pitch;
    if(b[0]===2)o+='<rect class="b" data-r="'+id+'" data-i="'+k+'" x="'+(x+.5).toFixed(1)+'" y="0.5" width="'+(bw-1).toFixed(1)+'" height="'+(h-1)+'" rx="2" fill="none" stroke="'+NOLOG+'"/>';
    else o+='<rect class="b" data-r="'+id+'" data-i="'+k+'" x="'+x.toFixed(1)+'" y="0" width="'+bw.toFixed(1)+'" height="'+h+'" rx="2" fill="'+(b[0]===1?ACC:OKC)+'"/>'});
  return o+'</svg>';
}
const ok_mark='<svg class="mk" width="14" height="14" viewBox="0 0 22 22"><path d="M5 11.5l4 4 8-9" fill="none" stroke="'+MUT+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const bad_mark='<svg class="mk" width="14" height="14" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9.5" fill="'+ACC+'"/><rect x="9.8" y="5" width="2.4" height="7.5" rx="1.2" fill="#0d1013"/><circle cx="11" cy="15.8" r="1.5" fill="#0d1013"/></svg>';
const kv=(l,v)=>'<div><dt>'+l+'</dt><dd>'+v+'</dd></div>';
function detailEx(r){
  const d=r.detail,gl=(d.gaps||[]).map(g=>hm(g[0])+' · '+f1(g[1]/1000)+' с').join(', ')||'—';
  const items=[
    kv('потеряно, с','за час '+f1(r.lost_1h_s)+' · за сутки '+f1(d.lost_24h_s)),
    kv('провалы',gl),
    kv('записи позже 2 с','за час '+(d.late_1h||0).toLocaleString('ru')+' · за сутки '+(d.late_24h||0).toLocaleString('ru')+(d.late_max_1h_s?' · макс. '+Math.round(d.late_max_1h_s)+' с':'')),
    kv('таймауты, сутки','пинг пропал '+(d.to_alive_24h??'—')+' · линия молчала '+(d.to_silent_24h??'—')),
    kv('переподключений за час',d.reconnects_1h??'—'),
    kv('сборка',esc((d.version||'?').slice(0,8))+' с '+hm(d.started)),
    kv('монет · сообщений/с',(d.symbols[0]??'—')+'/'+(d.symbols[1]??'—')+' · '+(d.msgs_s||0).toLocaleString('ru')),
    kv('задержка прихода p50/p99',(d.lag_in[0]??'—')+' / '+(d.lag_in[1]??'—')+' мс'),
    kv('пинг WS p50/макс',(d.ping[0]??'—')+' / '+(d.ping[1]??'—')+' мс'),
    kv('CPU, ядер',d.cpu==null?'—':String(d.cpu).replace('.',',')),
    kv('журнал',d.log_from?'с '+hm(d.log_from):'—'),
  ];
  return '<dl>'+items.join('')+'</dl>';
}

function popFoot(){const C=cols();$('colcnt').textContent='Показано: '+vis(C).length+' из '+C.length;$('rowcnt').textContent='Строк: '+nf(view.length,0)+' из '+nf(R.length,0);$('colreset').disabled=!hid.size&&!flN()}
function placePop(){const b=document.querySelector('#ctl [data-cols]'),p=$('colpop');if(!b)return;const r=b.getBoundingClientRect();p.style.top=(r.bottom+window.scrollY+4)+'px';p.style.left=Math.max(8,r.right+window.scrollX-p.offsetWidth)+'px'}

function head(){

/* порядок строк: выбранные биржи (обе у пары) и «скрыть пустые», сортировка по готовому массиву ключей */
function buildView(){

function rowHtml(r,C){

const chRow=()=>'<tr class="ch"><td colspan="'+NC+'"><div class="box"><div class="lg"><span><i style="border-color:'+ACC+'"></i>Sell, максимум за 3 мин</span><span><i style="border-color:'+INK+'"></i>Buy, минимум за 3 мин</span><span><i style="border-color:'+MUT+';border-top-style:dotted"></i>центр</span></div><div class="cwrap"><canvas id="cv"></canvas><div class="ld" id="ld">загрузка…</div><div id="tip2" class="pop"></div></div></div></td></tr>';

/* рисуем только строки у окна просмотра: над ними и под ними — пустые строки нужной высоты, высота таблицы та же, что у полной */
function paint(){
  const tb=$('tb'),n=view.length,C=vis(cols());NC=gc(C);colKey=st.mode+'|'+[...hid].sort().join(',');
  const oi=st.open?view.findIndex(i=>R[i].k===st.open):-1,ex=oi>=0?CHH:0;

  if(n){
    h+=sp(y(a));
    for(let p=a;p<=b;p++){h+=rowHtml(R[view[p]],C);if(p===oi)h+=chRow()}
    h+=sp(n*ROWH+ex-y(b+1));
  }

  const r0=tb.querySelector('tr.r');
  if(r0){const hh=r0.getBoundingClientRect().height;if(hh>20&&Math.abs(hh-ROWH)>.01){ROWH=hh;paint();return}}
  if(oi>=0){const c=tb.querySelector('tr.ch');if(c){const hh=c.getBoundingClientRect().height;if(hh>100&&Math.abs(hh-CHH)>.5){CHH=hh;paint();return}}drawChart()}
}
let sq=0;
function onScroll(){if(sq)return;sq=requestAnimationFrame(()=>{sq=0;if($('p-a').hidden||!view.length)return;
  const top=$('tb').getBoundingClientRect().top,vt=-top,vb=-top+window.innerHeight;
  const a=win.a*ROWH,b=(win.b+1)*ROWH+(st.open?CHH:0);   // грубо: окно рисованных строк по высоте
  if((vt<a+3*ROWH&&win.a>0)||(vb>b-3*ROWH&&win.b<view.length-1))paint()})}
function refresh(){buildView();paint()}
/* график пары: ряды берутся с сервера по клику (или при наведении) и держатся в памяти */
function chartKey(r){return A.gen+'|'+r.k}
function fetchChart(r){
  const k=chartKey(r);if(CH.has(k))return Promise.resolve(CH.get(k));
  if(PEND.has(k))return PEND.get(k);
  const p=fetch('/api/arb/chart?c='+encodeURIComponent(r.c)+'&a='+r.a+'&b='+r.b).then(x=>x.json()).then(j=>{if(j.error)throw new Error(j.error);if(CH.size>60)CH.delete(CH.keys().next().value);CH.set(k,j);PEND.delete(k);return j}).catch(e=>{PEND.delete(k);throw e});
  PEND.set(k,p);return p;
}
function drawChart(){
  const k=st.open,r=k&&R.find(x=>x.k===k),cv=$('cv');if(!r||!cv)return;
  const d=CH.get(chartKey(r));
  if(!d){fetchChart(r).then(()=>{if(st.open===k)drawChart()}).catch(()=>{const l=$('ld');if(l)l.textContent='график не получен'});return}
  const l=$('ld');if(l)l.hidden=true;
  const W=cv.parentNode.clientWidth,H=260,dpr=window.devicePixelRatio||1;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.font='10px "Geist Mono",ui-monospace,monospace';
  const L=46,Rr=8,T=6,B=20,pw=W-L-Rr,ph=H-T-B,t0=d.t0/1000,t1=d.t1/1000,step=d.slot,n=d.S.length;

  const spn=hi-lo,raw=spn/5,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,tk=(m<1.5?1:m<3?2:m<7?5:10)*p;

  if(lo<0&&hi>0){c.strokeStyle=cv0('--input');c.beginPath();c.moveTo(L,Y(0));c.lineTo(W-Rr,Y(0));c.stroke()}

    tip.innerHTML='<div class="tt">'+(long?dm(t0+i*step)+' ':'')+hm(t0+i*step)+'</div>'+rw('Sell макс',sgp(d.S[i]/10))+rw('Buy мин',sgp(d.B[i]/10))+(d.C[i]==null?'':rw('центр',sgp(d.C[i]/10)));
    tip.style.opacity=1;const w=tip.offsetWidth,cx=Math.min(Math.max(X(i)-w/2,0),rc.width-w);tip.style.left=cx+'px';tip.style.top=(Y(d.S[i]/10)>ph/2?T+4:ph-60)+'px'};

}
function show(){
  const pend=$('pend'),has=A&&!A.pending&&A.rows;
  $('tw').hidden=!has;pend.hidden=!!has;
  if(!has)pend.textContent=A&&A.pending?'Статистика считается — первая выдача появится в течение часа.':'Нет связи с сервером.';
}
/* опрос: только когда может появиться новое (проход раз в period секунд), с ETag; в скрытой вкладке и скрытой странице — нет */
let pollT=0,back=15,skew=0;
function schedule(changed){

async function load(){
  clearTimeout(pollT);

  let changed=false;
  try{
    const r=await fetch('/api/arb');const et=r.headers.get('etag'),dt=Date.parse(r.headers.get('date')||'');

function clk(){const t=Date.now()/1000;$('clock').textContent=dm(t)+' · '+hm(t)}

/* делегирование: один обработчик на панель, на заголовок и на тело таблицы */

/* фильтры строк: число (запятая или точка; пусто — выкл), применяется сразу и пишется в localStorage; смена набора строк закрывает открытый график, как смена бирж */

$('colpop').onchange=e=>{

/* подсказки: к заголовку столбца и к метке «снимки» — через 180 мс после наведения, под элементом; уходят при уходе курсора, клике, прокрутке */

window._arb={st,cols,vis,hid,xhid,FL,flN,SNAP,get sel(){return[...XS]},get ids(){return A&&A.names?Object.keys(A.names):[]},paint,refresh,setData,buildView,head,get view(){return view},get rows(){return R}};
})();
