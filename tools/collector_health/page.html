<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сбор данных</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--ink:#1d1d1b;--mut:#8c8a83;--acc:#cf4a2b;--ok:#8fbfa0;--nolog:#d3d1c9;--bg:#faf9f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",Roboto,Arial,sans-serif;padding:44px 48px 40px;font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:34px}
.top h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.02em}
.top .t{color:var(--mut);font-size:13px}
.cap{text-align:right;color:var(--mut);font-size:12px;margin:-14px 0 6px;padding-right:22px}
.row{padding:0 0 22px;outline:none;cursor:pointer;position:relative}
.row .hd{display:flex;align-items:center;height:36px;gap:10px}
.nm{font-size:17px;font-weight:600;min-width:90px}.nm.sm{font-size:14px;font-weight:500;color:var(--mut);margin-left:32px}
.mk{flex:none}
.val{margin-left:auto;display:flex;align-items:baseline;gap:5px}
.v{font-size:28px;font-weight:300;color:var(--mut);line-height:1}.v.bad{color:var(--acc);font-weight:500}
.u{font-size:13px;color:var(--mut)}
.chev{color:var(--mut);font-size:20px;width:14px;text-align:center;transition:transform .15s;margin-left:8px}
.net .chev{margin-left:auto}
.row:hover .chev,.row:focus-visible .chev{color:var(--ink)}
.row.open .chev{transform:rotate(90deg)}
.st svg{display:block}
.row.net{margin-top:10px;padding-top:22px;border-top:1px solid #ecebe5}
.detail{display:none;margin:16px 0 4px 32px;padding:16px 20px;background:#f3f2ed;border-radius:8px;cursor:default}
.row.open .detail{display:block}
dl{margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 28px}
dt{font-size:12px;color:var(--mut)}dd{margin:2px 0 0;font-size:14px}
.detail table{border-collapse:collapse;width:520px;max-width:100%}
.detail th{font-weight:400;font-size:12px;color:var(--mut);text-align:right;padding:2px 8px 6px}
.detail td{padding:4px 8px;text-align:right;font-size:14px}.detail td:first-child,.detail th:first-child{text-align:left;padding-left:0}
.b{cursor:pointer}.b:hover{opacity:.7}
.wrap{position:relative}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:6px;padding:8px 11px;font-size:12.5px;line-height:1.5;white-space:nowrap;opacity:0;transform:translate(-50%,0);z-index:5}
#tip b{font-weight:600}#tip .a{color:#ffb39e}#tip .m{color:#b9b7ae}

html{overflow-y:scroll}
.top{justify-content:flex-start;align-items:center;gap:24px}
.top .t{margin-left:auto}
.tabs{display:flex;gap:26px;margin-left:18px}
.tg button,.tabs button{all:unset;cursor:pointer;color:var(--mut);padding:4px 0;border-bottom:2px solid transparent;display:inline-flex;flex-direction:column;align-items:center}
.tg button::after,.tabs button::after{content:attr(data-t);font-weight:600;height:0;overflow:hidden;visibility:hidden}
.tabs button{font-size:15px}
.tg button:hover,.tabs button:hover{color:var(--ink)}
.tg button.on,.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--acc)}
[hidden]{display:none!important}
.flt{display:flex;gap:22px;margin:-6px 0 12px;font-size:14px;flex-wrap:wrap;height:30px}
.ctl{display:flex;gap:34px;margin:0 0 18px;font-size:14px;align-items:baseline;height:30px}
.ctl .g{display:flex;gap:18px;align-items:baseline}
.ctl .g>span{color:var(--mut);font-size:13px}
.ctl .cnt{display:inline-block;width:150px;color:var(--mut);font-size:12px;white-space:nowrap}
.ctl .upd{margin-left:auto;color:var(--mut);font-size:12px;white-space:nowrap}
table.a{border-collapse:collapse;width:100%;table-layout:fixed;font-variant-numeric:tabular-nums}
table.a th{font-weight:400;font-size:12px;line-height:1.25;color:var(--mut);text-align:right;vertical-align:bottom;height:38px;padding:0 14px 8px 0;cursor:pointer;white-space:normal}
table.a th.l,table.a td.l{text-align:left}
table.a th:hover,table.a th.on{color:var(--ink)}
.hl{position:relative;display:inline-block}
.hl .ar{position:absolute;left:100%;bottom:0;margin-left:3px;font-style:normal}
table.a td{padding:0 14px 0 0;height:42px;text-align:right;border-top:1px solid #ecebe5;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.a td.l{padding-right:8px}
table.a tr.r{cursor:pointer}
table.a tr.r:hover td{background:#f3f2ed}
table.a td.c{font-size:16px;font-weight:600}
table.a td.p{color:var(--mut);font-size:14px}
table.a td.none{color:var(--nolog)}
table.a tr.ch td{padding:6px 0 22px;height:auto;background:none!important;cursor:default;overflow:visible}
.cwrap{position:relative;height:300px}
.cwrap canvas{display:block;width:100%;height:300px}
.cwrap .ld{position:absolute;left:0;top:130px;width:100%;text-align:center;color:var(--mut);font-size:13px}
.lg{display:flex;gap:22px;font-size:12px;color:var(--mut);margin:0 0 4px;height:16px;white-space:nowrap}
.lg i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.pend{color:var(--mut);font-size:14px;padding:30px 0}
</style>
</head>
<body>
<div class="top"><h1>Сбор данных</h1><nav class="tabs"><button id="tab-a" data-t="Арбитраж" class="on">Арбитраж</button><button id="tab-h" data-t="Здоровье">Здоровье</button></nav><div class="t" id="clock"></div></div>
<section id="p-h" hidden>
<div class="cap">потеряно за час</div>
<div class="wrap" id="wrap"><div id="tip"></div><div id="rows"></div><div class="axis" id="axis"></div></div>
</section>

<section id="p-a">
<div class="flt tg" id="flt"></div>
<div class="ctl tg" id="ctl"></div>
<div class="pend" id="pend" hidden></div>
<table class="a" id="tab"></table>
</section>

<script>
const ACC='#cf4a2b',OKC='#8fbfa0',NOLOG='#d3d1c9',INK='#1d1d1b',MUT='#8c8a83',CELLC='#e3e1da';
let D=null,open=new Set(),W=1344;
const wrap=document.getElementById('wrap'),rowsEl=document.getElementById('rows'),axisEl=document.getElementById('axis'),tip=document.getElementById('tip'),clock=document.getElementById('clock');
const pad=n=>String(n).padStart(2,'0');
const gm=t=>new Date((t+4*3600)*1000);
const hm=t=>{const d=gm(t);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
const f1=v=>String(Math.round(v*10)/10).replace('.',',');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function bars(id,arr){
  const n=arr.length,pitch=W/n,bw=pitch-3,h=34;
  let o='<svg width="'+W+'" height="'+h+'" viewBox="0 0 '+W+' '+h+'" xmlns="http://www.w3.org/2000/svg">';
  arr.forEach((b,k)=>{const x=k*pitch;
    if(b[0]===2)o+='<rect class="b" data-r="'+id+'" data-i="'+k+'" x="'+(x+.5).toFixed(1)+'" y="0.5" width="'+(bw-1).toFixed(1)+'" height="'+(h-1)+'" rx="2.5" fill="none" stroke="'+NOLOG+'"/>';
    else o+='<rect class="b" data-r="'+id+'" data-i="'+k+'" x="'+x.toFixed(1)+'" y="0" width="'+bw.toFixed(1)+'" height="'+h+'" rx="2.5" fill="'+(b[0]===1?ACC:OKC)+'"/>'});
  return o+'</svg>';
}
const ok_mark='<svg class="mk" width="22" height="22" viewBox="0 0 22 22"><path d="M5 11.5l4 4 8-9" fill="none" stroke="'+MUT+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const bad_mark='<svg class="mk" width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="'+ACC+'"/><rect x="10" y="5.5" width="2" height="7" rx="1" fill="#fff"/><circle cx="11" cy="15.5" r="1.2" fill="#fff"/></svg>';
const kv=(l,v)=>'<div><dt>'+l+'</dt><dd>'+v+'</dd></div>';
function detailEx(r){
  const d=r.detail,gl=(d.gaps||[]).map(g=>hm(g[0])+' · '+f1(g[1]/1000)+' с').join(', ')||'—';
  const items=[
    kv('потеряно, с','за час '+f1(r.lost_1h_s)+' · за сутки '+f1(d.lost_24h_s)),
    kv('провалы',gl),
    kv('записи позже 2 с','за час '+(d.late_1h||0).toLocaleString('ru')+' · за сутки '+(d.late_24h||0).toLocaleString('ru')+(d.late_max_1h_s?' · макс. '+Math.round(d.late_max_1h_s)+' с':'')),
    kv('таймауты, сутки','пинг пропал '+(d.to_alive_24h??'—')+' · линия молчала '+(d.to_silent_24h??'—')),
    kv('переподключений за час',d.reconnects_1h??'—'),
    kv('сборка',esc((d.version||'?').slice(0,8))+' с '+hm(d.started)),
    kv('монет · сообщений/с',(d.symbols[0]??'—')+'/'+(d.symbols[1]??'—')+' · '+(d.msgs_s||0).toLocaleString('ru')),
    kv('задержка прихода p50/p99',(d.lag_in[0]??'—')+' / '+(d.lag_in[1]??'—')+' мс'),
    kv('пинг WS p50/макс',(d.ping[0]??'—')+' / '+(d.ping[1]??'—')+' мс'),
    kv('CPU, ядер',d.cpu==null?'—':String(d.cpu).replace('.',',')),
    kv('журнал',d.log_from?'с '+hm(d.log_from):'—'),
  ];
  return '<dl>'+items.join('')+'</dl>';
}
function detailNet(n){
  const rows=(n.detail||[]).map(x=>'<tr><td>'+x.name+'</td><td>'+f1(x.loss_pct)+' %</td><td>'+x.series+'</td><td>'+(x.p50==null?'—':Math.round(x.p50*10)/10)+' / '+(x.p99==null?'—':Math.round(x.p99))+' мс</td></tr>').join('');
  return '<table><thead><tr><th></th><th>потери, час</th><th>серий ≥ 3 подряд</th><th>отклик p50 / p99</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function block(r){
  const late=r.late_bad?(r.detail.late_1h||0):0,lost=r.lost_1h_s||0;
  const big=lost>0?f1(lost):(late>0?late.toLocaleString('ru'):'0'),unit=lost>0||!late?'с':'опозд.';
  const extra=lost>0&&late>0?'<span class="u" style="color:var(--acc)">+ '+late.toLocaleString('ru')+' опозд.</span>':'';
  const val='<span class="v'+(r.ok?'':' bad')+'">'+big+'</span><span class="u"'+(r.ok||lost>0?'':' style="color:var(--acc)"')+'>'+unit+'</span>'+extra;
  return '<section class="row'+(open.has(r.id)?' open':'')+'" id="'+r.id+'" tabindex="0"><div class="hd">'+(r.ok?ok_mark:bad_mark)+'<span class="nm">'+esc(r.name)+'</span><span class="val">'+val+'</span><span class="chev">›</span></div><div class="st">'+bars(r.id,r.bars)+'</div><div class="detail">'+detailEx(r)+'</div></section>';
}
function axis(){
  const s0=D.s0,len=D.slot*D.rows[0].bars.length;
  let o='<svg width="'+W+'" height="34" viewBox="0 0 '+W+' 34" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,Segoe UI,Arial"><line x1="0" y1="4.5" x2="'+W+'" y2="4.5" stroke="'+CELLC+'"/>';
  for(let t=Math.ceil(s0/3600)*3600;t<=s0+len;t+=3600){const h=gm(t).getUTCHours();if(h%4)continue;const x=(t-s0)/len*W;
    o+='<line x1="'+x.toFixed(1)+'" y1="4.5" x2="'+x.toFixed(1)+'" y2="9" stroke="'+MUT+'"/><text x="'+x.toFixed(1)+'" y="24" font-size="12" fill="'+MUT+'" text-anchor="middle">'+pad(h)+':00</text>'}
  (D.restarts||[]).forEach(t=>{if(t<s0||t>s0+len)return;const x=(t-s0)/len*W;
    o+='<line x1="'+x.toFixed(1)+'" y1="0" x2="'+x.toFixed(1)+'" y2="12" stroke="'+INK+'" stroke-width="1.6"><title>перезапуск '+hm(t)+'</title></line>'});
  return o+'</svg>';
}
function render(){
  if(!D||!D.rows)return;
  W=Math.max(600,Math.floor(wrap.clientWidth));
  const net='<section class="row net'+(open.has('net')?' open':'')+'" id="net" tabindex="0"><div class="hd"><span class="nm sm">сеть</span><span class="chev">›</span></div><div class="st">'+bars('net',D.net.bars)+'</div><div class="detail">'+detailNet(D.net)+'</div></section>';
  rowsEl.innerHTML=D.rows.map(block).join('')+net;axisEl.innerHTML=axis();
  clock.textContent=pad(gm(D.now).getUTCDate())+'.'+pad(gm(D.now).getUTCMonth()+1)+' · '+hm(D.now);
  rowsEl.querySelectorAll('.row').forEach(r=>{
    r.addEventListener('click',e=>{if(e.target.closest('.detail'))return;r.classList.toggle('open');r.classList.contains('open')?open.add(r.id):open.delete(r.id)});
    r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();r.click()}})});
  rowsEl.querySelectorAll('.b').forEach(e=>{e.addEventListener('mouseenter',()=>show(e));e.addEventListener('mouseleave',()=>tip.style.opacity=0)});
  const m=location.hash.match(/tip=(\w+)-(\d+)/);if(m){const el=rowsEl.querySelector('.b[data-r="'+m[1]+'"][data-i="'+m[2]+'"]');if(el)show(el)}
}
function show(el){
  const id=el.dataset.r,i=+el.dataset.i,arr=id==='net'?D.net.bars:D.rows.find(r=>r.id===id).bars,d=arr[i],a=D.s0+i*D.slot;
  let h='<b>'+hm(a)+' – '+hm(a+D.slot)+'</b>';
  if(d[0]===2)h+='<br><span class="m">нет журнала</span>';
  else if(id==='net')h+='<br>'+(d[0]?'<span class="a">':'')+'потеряно замеров '+f1(d[1])+' %'+(d[0]?'</span>':'');
  else{
    const lost=d[1]/1000,late=d[2];
    h+='<br>'+(lost>0?'<span class="a">потеряно '+f1(lost)+' с</span>':'потеряно 0 с');
    h+='<br>'+(late==null?'<span class="m">опоздавшие записи —</span>':(late>0?(d[6]?'<span class="a">опоздавшие записи '+late.toLocaleString('ru')+'</span>':'опоздавшие записи '+late.toLocaleString('ru')):'опоздавшие записи 0'));
    h+='<br>таймауты '+(d[3]+d[4])+((d[3]+d[4])?' <span class="m">· пинг пропал '+d[3]+' · молчала '+d[4]+'</span>':'');
    if(d[5])h+='<br><span class="m">перезапуск сборки</span>';
  }
  tip.innerHTML=h;const b=el.getBoundingClientRect(),w=wrap.getBoundingClientRect();
  tip.style.opacity=1;const half=tip.offsetWidth/2,cx=Math.min(Math.max(b.left-w.left+b.width/2,half),w.width-half);
  tip.style.left=cx+'px';tip.style.top=(b.bottom-w.top+8)+'px';
}
async function load(){
  try{const r=await fetch('/api/v3',{cache:'no-store'});const d=await r.json();if(d.error)throw new Error(d.error);D=d;render();document.title='Сбор данных'}
  catch(e){document.title='Сбор данных · нет связи'}
}
window.addEventListener('resize',()=>{render()});
load();setInterval(load,30000);
</script>
<script>
(function(){
const INK='#1d1d1b',MUT='#8c8a83',ACC='#cf4a2b',LINE='#e3e1da';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const gm=t=>new Date((t+4*3600)*1000);
const hm=t=>{const d=gm(t);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
const dm=t=>{const d=gm(t);return pad(d.getUTCDate())+'.'+pad(d.getUTCMonth()+1)};
const nf=(v,d=1)=>(Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toLocaleString('ru',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=v=>v==null?'—':(v>0?'+':v<0?'−':'')+nf(Math.abs(v),1);
function dur(s){if(s==null)return '—';if(s<1)return nf(s*1000,0)+' мс';if(s<60)return nf(s,s<10?1:0)+' с';if(s<3600)return nf(s/60,s<600?1:0)+' мин';return nf(s/3600,1)+' ч'}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const key=r=>r.c+'|'+r.a+'|'+r.b;
let A=null,CH={},st={pair:'all',sort:'size',dir:-1,open:null,mode:'med',hide:false};
const at=(a,k)=>a?a[k]:null;
const W=[11,14,11,11,7,7,7,8,12,12];
function cols(){
  const o=st.mode==='out';
  const cnt=(i,t)=>({k:'n'+i,t:'эпизодов<br>'+t,v:r=>r.cnt[i],f:v=>nf(v,0),z:1});
  return [{k:'c',t:'монета',l:1,v:r=>r.c},{k:'p',t:'пара бирж',l:1,v:r=>A.names[r.a]+A.names[r.b]}].concat(o?[
    {k:'size',t:'расхождение<br>p95, bps',v:r=>at(r.pk,1),f:v=>nf(v,1)},
    {k:'max',t:'расхождение<br>макс, bps',v:r=>at(r.pk,2),f:v=>nf(v,1)}
  ]:[
    {k:'size',t:'расхождение, bps',span:2,v:r=>at(r.pk,0),f:v=>nf(v,1)}
  ]).concat([cnt(0,'за 1 ч'),cnt(1,'за 4 ч'),cnt(2,'за 6 ч'),cnt(3,'за 1 сут')]).concat(o?[
    {k:'tau',t:'схождение<br>p95',v:r=>at(r.tau,1),f:dur,low:1},
    {k:'net',t:'после комиссий<br>p95, bps',v:r=>at(r.net,1),f:sg}
  ]:[
    {k:'tau',t:'схождение,<br>медиана',v:r=>at(r.tau,0),f:dur,low:1},
    {k:'net',t:'после комиссий,<br>bps',v:r=>at(r.net,0),f:sg}
  ]);
}
const empty=r=>r.cnt[3]===0;
function btn(attr,val,on,t){return '<button '+attr+'="'+val+'" data-t="'+t+'" class="'+(on?'on':'')+'">'+t+'</button>'}
function flt(){
  const pairs=A&&A.rows?[...new Set(A.rows.map(r=>r.a+'|'+r.b))]:[];
  $('flt').innerHTML=btn('data-p','all',st.pair==='all','Все')+pairs.map(p=>{const[a,b]=p.split('|');return btn('data-p',p,st.pair===p,A.names[a]+' → '+A.names[b])}).join('');
  $('flt').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.pair=b.dataset.p;st.open=null;flt();ctl();table()});
}
function ctl(){
  const inPair=A&&A.rows?A.rows.filter(r=>st.pair==='all'||r.a+'|'+r.b===st.pair):[],ne=inPair.filter(empty).length;
  $('ctl').innerHTML='<div class="g"><span>счёт</span>'+btn('data-m','med',st.mode==='med','медиана')+btn('data-m','out',st.mode==='out','выбросы')+'</div>'
    +'<div class="g">'+btn('data-hide','1',st.hide,'скрыть пустые')+'<span class="cnt">'+(st.hide?'скрыто ':'пустых: ')+ne+' из '+inPair.length+'</span></div>'
    +'<span class="upd">'+(A&&A.gen?'обновлено '+hm(A.gen/1000):'')+'</span>';
  $('ctl').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(b.dataset.m){st.mode=b.dataset.m;if(!cols().some(c=>c.k===st.sort))st.sort='size'}else st.hide=!st.hide;
    ctl();table()});
}
function table(){
  const tb=$('tab'),pend=$('pend');
  if(!A||A.pending||!A.rows){tb.innerHTML='';pend.hidden=false;pend.textContent=A&&A.pending?'Статистика считается — первая выдача появится в течение часа.':'Нет связи с сервером.';return}
  pend.hidden=true;
  const C=cols();let col=C.find(c=>c.k===st.sort);if(!col){st.sort='size';col=C.find(c=>c.k==='size')}
  const rs=A.rows.filter(r=>(st.pair==='all'||r.a+'|'+r.b===st.pair)&&!(st.hide&&empty(r)));
  const val=(c,r)=>{const x=c.v(r);return x==null?(c.low?1e12:-1e9):x};
  rs.sort((x,y)=>{const a=val(col,x),b=val(col,y);return (typeof a==='string'?a.localeCompare(b):a-b)*st.dir});
  const cg='<colgroup>'+W.map(w=>'<col style="width:'+w+'%">').join('')+'</colgroup>';
  const th='<thead><tr>'+C.map(c=>'<th data-k="'+c.k+'" class="'+(c.l?'l ':'')+(c.k===st.sort?'on':'')+'"'+(c.span?' colspan="'+c.span+'"':'')+'><span class="hl">'+c.t+'<i class="ar">'+(c.k===st.sort?(st.dir<0?'↓':'↑'):'')+'</i></span></th>').join('')+'</tr></thead>';
  const body=rs.map(r=>{
    const none=empty(r),k=key(r);
    const cells=C.slice(2).map(c=>{const x=c.v(r);const nn=x==null;return '<td'+(c.span?' colspan="'+c.span+'"':'')+' class="'+((none||nn)&&!c.z||none&&c.z?'none':'')+'">'+(nn?'—':c.f(x))+'</td>'}).join('');
    const open=st.open===k;
    return '<tr class="r" data-k="'+esc(k)+'"><td class="l c">'+esc(r.c)+'</td><td class="l p">'+A.names[r.a]+' → '+A.names[r.b]+'</td>'+cells+'</tr>'
      +(open?'<tr class="ch"><td colspan="10"><div class="lg"><span><i style="border-color:'+ACC+'"></i>Sell, максимум за 3 мин</span><span><i style="border-color:'+INK+'"></i>Buy, минимум за 3 мин</span><span><i style="border-color:'+MUT+';border-top-style:dotted"></i>центр</span></div><div class="cwrap"><canvas id="cv"></canvas><div class="ld" id="ld">загрузка…</div><div id="tip2" style="position:absolute;pointer-events:none;background:#1d1d1b;color:#fff;border-radius:6px;padding:8px 11px;font-size:12.5px;line-height:1.5;white-space:nowrap;opacity:0;z-index:5"></div></div></td></tr>':'');
  }).join('');
  tb.innerHTML=cg+th+'<tbody>'+body+'</tbody>';
  tb.querySelectorAll('th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(st.sort===k)st.dir*=-1;else{st.sort=k;st.dir=(k==='c'||k==='p'||k==='tau')?1:-1}table()});
  tb.querySelectorAll('tr.r').forEach(tr=>tr.onclick=()=>{const k=tr.dataset.k;st.open=st.open===k?null:k;table();if(st.open)$('cv').scrollIntoView({block:'nearest'})});
  if(st.open)chart();
}
function chart(){
  const k=st.open,r=A&&A.rows&&A.rows.find(x=>key(x)===k),cv=$('cv');if(!r||!cv)return;
  const ck=A.gen+'|'+k,d=CH[ck];
  if(!d){
    fetch('/api/arb/chart?c='+encodeURIComponent(r.c)+'&a='+r.a+'&b='+r.b,{cache:'no-store'}).then(x=>x.json()).then(j=>{if(j.error)throw new Error(j.error);CH={};CH[ck]=j;if(st.open===k&&$('cv'))chart()}).catch(()=>{const l=$('ld');if(l)l.textContent='график не получен'});
    return}
  const l=$('ld');if(l)l.hidden=true;
  const W=cv.parentNode.clientWidth,H=300,dpr=window.devicePixelRatio||1;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.font='12px system-ui,Segoe UI,Arial';
  const L=46,R=10,T=8,B=24,pw=W-L-R,ph=H-T-B,t0=d.t0/1000,t1=d.t1/1000,step=d.slot,n=d.S.length;
  let lo=1e9,hi=-1e9;
  [d.S,d.B,d.C].forEach(a=>a.forEach(v=>{if(v!=null){lo=Math.min(lo,v/10);hi=Math.max(hi,v/10)}}));
  if(lo>hi){lo=-1;hi=1}
  const pdv=(hi-lo)*.06||1;lo-=pdv;hi+=pdv;
  const X=i=>L+(i+.5)*step/(t1-t0)*pw,Y=v=>T+ph-(v-lo)/(hi-lo)*ph;
  c.strokeStyle=LINE;c.fillStyle=MUT;c.lineWidth=1;c.textAlign='right';
  const sp=hi-lo,raw=sp/5,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,tk=(m<1.5?1:m<3?2:m<7?5:10)*p;
  for(let v=Math.ceil(lo/tk)*tk;v<=hi;v+=tk){const y=Y(v);c.beginPath();c.moveTo(L,y);c.lineTo(W-R,y);c.stroke();c.fillText((v<0?'−':'')+nf(Math.abs(v),tk<1?1:0),L-6,y+4)}
  if(lo<0&&hi>0){c.strokeStyle=MUT;c.beginPath();c.moveTo(L,Y(0));c.lineTo(W-R,Y(0));c.stroke()}
  const long=t1-t0>20*3600,lab=t=>long?dm(t)+' '+hm(t):hm(t);
  c.fillStyle=MUT;for(let i=0;i<=4;i++){c.textAlign=i===0?'left':i===4?'right':'center';c.fillText(lab(t0+(t1-t0)*i/4),L+pw*i/4,H-7)}
  const line=(a,col,w,dash)=>{c.save();c.strokeStyle=col;c.lineWidth=w;c.setLineDash(dash||[]);c.beginPath();let on=false;a.forEach((v,i)=>{if(v==null){on=false;return}const x=X(i),y=Y(v/10);if(!on){c.moveTo(x,y);on=true}else c.lineTo(x,y)});c.stroke();c.restore()};
  line(d.C,MUT,1,[2,3]);line(d.B,INK,1.5);line(d.S,ACC,1.5);
  const tip=$('tip2');
  cv.onmousemove=e=>{const rc=cv.getBoundingClientRect(),x=e.clientX-rc.left;let i=Math.round((x-L)/pw*(t1-t0)/step-.5);i=Math.max(0,Math.min(n-1,i));
    if(d.S[i]==null){tip.style.opacity=0;return}
    tip.innerHTML='<b>'+(long?dm(t0+i*step)+' ':'')+hm(t0+i*step)+'</b><br>Sell макс '+sg(d.S[i]/10)+'<br>Buy мин '+sg(d.B[i]/10)+(d.C[i]==null?'':'<br>центр '+sg(d.C[i]/10));
    tip.style.opacity=1;const w=tip.offsetWidth,cx=Math.min(Math.max(X(i)-w/2,0),rc.width-w);tip.style.left=cx+'px';tip.style.top=(Y(d.S[i]/10)>ph/2?T+4:ph-60)+'px'};
  cv.onmouseleave=()=>tip.style.opacity=0;
}
async function load(){
  try{const r=await fetch('/api/arb',{cache:'no-store'});const j=await r.json();
    if(A&&j.gen&&j.gen===A.gen)return;
    A=j;if(A.rows&&st.open&&!A.rows.some(x=>key(x)===st.open))st.open=null;
    flt();ctl();table()}
  catch(e){if(!A){A={};table()}}
}
function tab(a,keep){$('p-a').hidden=!a;$('p-h').hidden=a;$('tab-a').classList.toggle('on',a);$('tab-h').classList.toggle('on',!a);
  if(!keep)history.replaceState(null,'',a?'#arb':'#health');
  if(a){if(st.open)chart()}else if(window.render)window.render()}
$('tab-a').onclick=()=>tab(true);$('tab-h').onclick=()=>tab(false);
window.addEventListener('resize',()=>{if(!$('p-a').hidden&&st.open)chart()});
flt();ctl();
if(/^#(health|.*tip=)/.test(location.hash))tab(false,true);else tab(true,true);
load();setInterval(load,60000);
window._arb={st,table,ctl,cols};
})();
</script>
