<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Табло alpha · Конвейер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="phosphor.css">
<style>
/* Направление 2 «Конвейер»: работа как конвейер — волны задач в рамках-окнах; у каждой задачи цепочка шагов, шаги одной
   волны (параллельные) стоят столбиком; узел «вы» залит. Вопросы к вам справа, на телефоне первыми. Люминофор по умолчанию — янтарный. */
.d2{--mono:"Fira Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;--fs:clamp(12px,.4rem + .46vw,15px);--maxw:1500px}
.d2 .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(16rem,21rem);grid-template-rows:auto auto auto auto 1fr auto;grid-template-areas:"top top" "main ask" "main mach" "main feed" "main ." "leg leg";gap:1.5em 3ch;align-items:start}
.d2 .top{grid-area:top;display:grid;gap:.9em}
.d2 .ttl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6em 3ch}
.d2 .ttl h1{margin:0;font-size:calc(var(--fs)*1.5);letter-spacing:.2em;text-transform:uppercase;color:var(--hot);text-shadow:0 0 2px var(--fg),0 0 12px rgba(var(--fg-rgb),.7)}
.d2 .big{padding:.15em 1ch;font-weight:700;letter-spacing:.06em}
.d2 .big.plain{padding:.15em 0}
.d2 .pr{display:grid;grid-template-columns:auto minmax(8ch,1fr) auto;gap:.3em 2ch;align-items:center}
.d2 .counts{display:flex;flex-wrap:wrap;gap:.2em 3ch}
.d2 .main{grid-area:main;display:grid;gap:0;min-width:0}
.d2 .ask{grid-area:ask}.d2 .mach{grid-area:mach}.d2 .fd{grid-area:feed}.d2 .leg{grid-area:leg}
.d2 .win,.d2 .pn{border:1px solid rgba(var(--fg-rgb),.5);padding:0 1.6ch 1em;min-width:0}
.d2 .wt,.d2 .pnt{display:flex;flex-wrap:wrap;gap:0 1.5ch;align-items:baseline;margin:0 -1.6ch 1em;padding:.22em 1.6ch;font-size:.88em;letter-spacing:.14em;text-transform:uppercase;background:rgba(var(--fg-rgb),.88);color:var(--bg);text-shadow:none;font-weight:700}
.d2 .pn:not(.ask) .pnt,.d2 .win.w-todo .wt,.d2 .win.w-done .wt{background:rgba(var(--fg-rgb),.3);color:var(--hot)}
.d2 .win.w-bad{border:3px double var(--hot)}
.d2 .win.w-bad .wt{background:var(--hot);color:var(--bg)}
.d2 .wgap{display:flex;flex-direction:column;align-items:center;gap:.2em;padding:.6em 0;color:rgba(var(--fg-rgb),.62);font-size:.88em}
.d2 .wgap::before,.d2 .wgap::after{content:"";width:1px;height:1.1em;background:rgba(var(--fg-rgb),.5)}
.d2 .lane{padding:.9em 0 1em;border-top:1px dashed rgba(var(--fg-rgb),.3)}
.d2 .lane:first-of-type{border-top:0;padding-top:.2em}
.d2 .rp{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2em 1.6ch}
.d2 .rp .nm b{font-size:1.1em;color:var(--hot);text-shadow:0 0 2px var(--fg),0 0 9px rgba(var(--fg-rgb),.55)}
.d2 .rp .if{margin-left:auto}
.d2 .lsum{margin:.35em 0 0 4.6ch}
.d2 .lflow{margin:.15em 0 0 4.6ch;font-size:.92em}
.d2 .chain{display:flex;gap:2.2ch;margin-top:1em;align-items:stretch}
.d2 .lane.closed .chain{display:none}
.d2 .col{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:.5em}
.d2 .col+.col::before{content:"";position:absolute;right:100%;top:1.2em;width:2.2ch;height:1px;background:rgba(var(--fg-rgb),.7)}
.d2 .col+.col::after{content:"";position:absolute;right:calc(100% - 1px);top:calc(1.2em - 3.5px);border-style:solid;border-width:3.5px 0 3.5px 6px;border-color:transparent transparent transparent rgba(var(--fg-rgb),.85)}
.d2 .nd{flex:1 1 auto;border:1px solid rgba(var(--fg-rgb),.55);padding:.5em .9ch .6em;display:flex;flex-direction:column;gap:.2em;min-width:0}
.d2 .nd .nn{font-size:.82em;opacity:.75}
.d2 .nd .nt{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.d2 .nd .nk{font-size:.76em;letter-spacing:.12em;text-transform:uppercase;margin-top:auto;padding-top:.3em}
.d2 .nd .nw,.d2 .nd .nf,.d2 .nd .ns{font-size:.86em;overflow-wrap:anywhere;opacity:.88}
.d2 .nd .nf,.d2 .nd .ns{display:none}
.d2 .lane[data-open="1"] .nd .nf,.d2 .lane[data-open="1"] .nd .ns{display:block}
.d2 .nd.s-done{border-color:rgba(var(--fg-rgb),.35);color:rgba(var(--fg-rgb),.65);text-shadow:none}
.d2 .nd.s-run{border-color:var(--hot);color:var(--hot);box-shadow:0 0 14px rgba(var(--fg-rgb),.4),inset 0 0 14px rgba(var(--fg-rgb),.12)}
.d2 .nd.s-review{border-color:var(--hot);border-style:dotted;border-width:2px;color:var(--hot)}
.d2 .nd.s-repair{border-color:var(--hot);border-style:dashed;border-width:2px;color:var(--hot);box-shadow:0 0 10px rgba(var(--fg-rgb),.3)}
.d2 .nd.s-wait{background:var(--fg);color:var(--bg);text-shadow:none;border-color:var(--fg);box-shadow:0 0 18px rgba(var(--fg-rgb),.5)}
.d2 .nd.s-todo{border-style:dashed;border-color:rgba(var(--fg-rgb),.4);color:rgba(var(--fg-rgb),.55);text-shadow:none}
.d2 .nd.s-bad{border:3px double var(--hot);padding:.4em calc(.9ch - 2px) .5em;color:var(--hot);box-shadow:0 0 16px rgba(var(--fg-rgb),.45)}
.d2 .nd .bar{margin-top:.2em}
.d2 .mi{display:grid;gap:.05em;padding:.35em 0}
.d2 .mi+.mi{border-top:1px dashed rgba(var(--fg-rgb),.25)}
.d2 .fl{display:grid;grid-template-columns:5.5ch minmax(0,1fr);gap:0 1.6ch;padding:.15em 0}
.d2 .ask .q+.q{margin-top:1.1em;padding-top:1.1em;border-top:1px dashed rgba(var(--fg-rgb),.3)}
.d2 .qt{font-size:1em}
@media (max-width:1080px){
  .d2 .grid{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"top" "ask" "main" "mach" "feed" "leg"}
}
@media (max-width:760px){
  .d2 .pr{grid-template-columns:minmax(0,1fr)}
  .d2 .chain{flex-direction:column;gap:2em}
  .d2 .col+.col::before{right:auto;left:1.6ch;top:auto;bottom:100%;width:1px;height:2em}
  .d2 .col+.col::after{display:none}
  .d2 .lflow,.d2 .lsum{margin-left:0}
  .d2 .rp .if{margin-left:0;flex-basis:100%}
}
</style>
</head>
<body>
<noscript>Для табло нужен JavaScript.</noscript>
<script src="phosphor.js"></script>
<script>
(() => {
  const { E, arr, tok, mt, seg, bar, lamp, flow, forTxt, tm, sdet, waitTxt, pinfo, groups, stepWaves, counts, headline, progress, legend, questions, feedWho, ui } = Board;

  const node = (s) => {
    const ns = s.state === "wait" ? waitTxt(s) : [tm(s), sdet(s)].filter(Boolean).join(" · ");
    return `<div class="nd s-${Board.sk(s.state)}"><span class="nn">шаг ${E(s.n)}</span><span class="nt">${E(s.title)}</span><span class="nw">${s.who === "вы" ? mt("you") : `${E(s.who)} · ${mt(s.on)}`}</span><span class="nf">${s.for ? "для: " + E(s.for) : ""}</span><span class="ns">${ns}</span>${s.state === "run" && s.pct != null ? bar(s.pct, 10) : ""}<span class="nk">${Board.ST[Board.sk(s.state)]}</span></div>`;
  };
  const lane = (p) => {
    const open = ui.open.has(p.id);
    const closed = p.state === "done" && !open;
    return `<div class="proc lane${closed ? " closed" : ""}" data-open="${open ? 1 : 0}">
      <button type="button" class="rp" data-act="toggle" data-id="${E(p.id)}" aria-expanded="${open}"><span class="m" aria-hidden="true"></span>${tok(p.state)}<span class="nm"><b>${E(p.title)}</b></span><span class="if dim">${pinfo(p)}</span></button>
      ${p.summary ? `<div class="sum lsum">${E(p.summary)}</div>` : ""}
      <div class="lflow dim">${[flow(p), forTxt(p)].filter(Boolean).join(" · ")}</div>
      <div class="chain">${stepWaves(p).map((w) => `<div class="col">${w.steps.map(node).join("")}</div>`).join("")}</div></div>`;
  };

  Board.start({
    id: "konveyer", cls: "d2", ph: "amber", title: "Табло alpha · Конвейер", path: "alpha@табло:~/волны", model: "Табло · Конвейер",
    render(v) {
      const pr = progress(), g = groups();
      const wins = g.map((w, i) => {
        const prev = g[i - 1];
        const gap = i > 0 && w.n != null && prev && prev.n != null ? `<div class="wgap">ждём конца волны ${E(prev.n)}</div>` : i > 0 ? `<div class="wgap"></div>` : "";
        return `${gap}<section class="win w-${Board.sk(w.state === "bad" ? "bad" : w.state)}" aria-label="${E(w.label)}"><div class="wt"><span>${E(w.label || "Процессы")}</span></div>${w.procs.map(lane).join("")}</section>`;
      }).join("");
      const mach = arr(v.machines).map((m) => `<div class="mi"><span>${lamp((m.now || {}).state)}<b>${E(Board.tagOf(m.id).name)}</b> ${mt(m.id)}</span><span class="dim small">${E((m.now || {}).text || "")}${m.load ? " · " + E(m.load) : ""}</span></div>`).join("");
      const feed = arr(v.feed).map((f) => `<div class="fl"><span class="dim">${E(f.time)}</span><span>${tok(f.state)} ${feedWho(f)} ${E(f.text)}</span></div>`).join("") || `<div class="none">пока тихо</div>`;
      const nq = arr(v.questions).filter((q) => !ui.answered[q.id] && !q.web_answer).length;
      return `<div class="grid">
   <div class="top"><div class="ttl"><h1>Конвейер · ход работ</h1>${headline()}</div>
     <div class="pr"><span>${pr.left}</span>${pr.strip}<span>${pr.right}</span></div>
     <div class="counts">${counts()}</div></div>
   <div class="main">${wins || '<div class="none">процессов нет</div>'}</div>
   <section class="pn ask" aria-label="Вопросы вам"><div class="pnt"><span>Вам ответить · ${nq}</span></div>${questions()}</section>
   <section class="pn mach" aria-label="Машины"><div class="pnt"><span>Где что делается</span></div>${mach || '<div class="none">машин нет в сводке</div>'}</section>
   <section class="pn fd" aria-label="Лента"><div class="pnt"><span>Недавно</span></div>${feed}</section>
   <div class="leg">${legend()}</div></div>`;
    },
  });
})();
</script>
</body>
</html>
