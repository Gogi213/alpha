[package]
name = "pq2bin"
version = "0.1.0"
edition = "2021"

[dependencies]
parquet = { version = "55", default-features = false, features = ["arrow", "zstd", "snap"] }
arrow-array = "55"
arrow-schema = "55"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
