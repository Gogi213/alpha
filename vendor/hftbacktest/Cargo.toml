# Локальная копия hftbacktest 0.9.4 (MIT, © nkaz001, https://github.com/nkaz001/hftbacktest)
# с **одним** исправлением в `src/backtest/proc/partialfillexchange.rs`:
# нога, исполненная сделкой ровно до нуля (`filled_qty == leaves_qty`), не попадала
# в `filled_orders` (там строгое `>`), оставалась в карте биржи со статусом `Filled`
# и на следующей сделке по той же цене пыталась исполниться второй раз →
# `InvalidOrderStatus` ронял весь прогон. Исправление: `>` → `>=` в двух местах
# (`check_if_buy_filled`, `check_if_sell_filled`).
# Разбор, воспроизведение и замер — `docs/findings/hftbacktest-partialfill-fix-2026-09-20.md`.
# Подключение — `[patch.crates-io]` в корневом `Cargo.toml`; других правок в крейте нет.
[package]
edition = "2024"
rust-version = "1.91.1"
name = "hftbacktest"
version = "0.9.4"
authors = ["nkaz001 <nkaz001@protonmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A high-frequency trading and market-making backtesting tool accounts for limit orders, queue positions, and latencies, utilizing full tick data for trades and order books."
documentation = "https://docs.rs/hftbacktest/"
readme = "README.md"
keywords = [
    "quantitative",
    "trading",
    "backtesting",
    "cryptocurrency",
    "hft",
]
categories = [
    "finance",
    "mathematics",
    "science",
    "algorithms",
    "simulation",
]
license = "MIT"
repository = "https://github.com/nkaz001/hftbacktest/"
resolver = "2"

[features]
backtest = [
    "zip",
    "uuid",
    "nom",
    "hftbacktest-derive",
]
default = [
    "backtest",
    "live",
]
live = [
    "chrono",
    "tokio",
    "futures-util",
    "iceoryx2",
    "rand",
    "toml",
    "serde",
]
s3 = [
    "aws-config",
    "aws-sdk-s3",
    "tokio",
]

[lib]
name = "hftbacktest"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1.0.100"

[dependencies.aws-config]
version = "1.8.11"
features = ["behavior-version-latest"]
optional = true

[dependencies.aws-sdk-s3]
version = "1.116.0"
optional = true

[dependencies.bincode]
version = "2.0.1"

[dependencies.chrono]
version = "0.4.42"
optional = true

[dependencies.dyn-clone]
version = "1.0.20"

[dependencies.futures-util]
version = "0.3.31"
optional = true

[dependencies.hftbacktest-derive]
version = "0.2.0"
optional = true

[dependencies.iceoryx2]
version = "0.6.1"
features = ["logger_tracing"]
optional = true

[dependencies.nom]
version = "8"
optional = true

[dependencies.rand]
version = "0.9.2"
optional = true

[dependencies.serde]
version = "1.0.228"
features = ["derive"]
optional = true

[dependencies.thiserror]
version = "2.0.17"

[dependencies.tokio]
version = "1.48.0"
features = ["full"]
optional = true

[dependencies.toml]
version = "0.9.8"
optional = true

[dependencies.tracing]
version = "0.1.43"

[dependencies.uuid]
version = "1.19.0"
features = ["v4"]
optional = true

[dependencies.zip]
version = "6.0.0"
optional = true

[target.'cfg(target_arch = "arm")'.dependencies.aws-lc-rs]
version = "1"
features = ["bindgen"]
