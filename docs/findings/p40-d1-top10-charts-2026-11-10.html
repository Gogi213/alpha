<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#1b1d21; --ink2:#464b54; --ink3:#767c86; --line:#dcdfe4; --grid:#ebedf0;

  --accent:#2563eb; --chip:#eef0f3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121418; --panel:#1b1e24; --ink:#e8eaee; --ink2:#b9bec8; --ink3:#8b919c; --line:#343942; --grid:#272b32;

    --pos:#4ade80; --neg:#f87171; --warn:#f0b35a; --warnbg:#2c2417; --warnline:#6b5326;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 24px}
h1{font-size:clamp(1.05rem,5vw,1.5rem);line-height:1.2;margin:18px 0 10px;white-space:nowrap}
h3{font-size:.98rem;margin:16px 0 4px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:right}
td{white-space:nowrap}
td.l{white-space:normal}
th{font-weight:600;color:var(--ink2);vertical-align:bottom;line-height:1.2}
th.l,td.l{text-align:left}
td.l a{color:inherit;text-decoration:none;font-weight:600}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--chip)}
.verdict{margin:12px 0 8px;font-weight:600}
.jump{display:flex;flex-wrap:wrap;gap:4px 6px;margin:8px 0 4px}
.jump a{color:var(--ink2);background:var(--chip);border-radius:999px;padding:1px 10px;font-size:.84rem;text-decoration:none;white-space:nowrap}
.jump a:hover{color:var(--ink)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:.82rem;white-space:nowrap}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:5px;vertical-align:baseline}
details.pair{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:12px 0;scroll-margin-top:10px}
details.pair>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
details.pair>summary::-webkit-details-marker{display:none}
details.pair>summary::before{content:"";flex:none;width:.5em;height:.5em;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(-45deg);margin:0 4px 0 2px;transition:transform .12s}
details.pair[open]>summary::before{transform:rotate(45deg)}
.num{display:inline-block;min-width:1.7em;text-align:center;background:var(--chip);border-radius:6px;font-size:.9rem}
.tk{font-size:1.12rem}
.st{color:var(--ink2);font-size:.9rem;white-space:nowrap}
.st b{color:var(--ink)}
.pbody{padding:0 14px 14px}
.chart{position:relative;width:100%;min-height:240px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax{fill:var(--ink3);font-size:11px}
.axl{fill:var(--ink2);font-size:11.5px}
.gl{stroke:var(--grid);stroke-width:1;fill:none}
.legend{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:.84rem;color:var(--ink2);margin:4px 0 2px}
.legend i{display:inline-block;width:14px;height:9px;margin-right:5px;vertical-align:baseline;border-radius:2px}
.legend i.r{width:9px;height:9px;border-radius:50%}
.legend i.ln{height:0;border-top:2px solid var(--ink2);border-radius:0;vertical-align:middle}
.legend i.ln.d{border-top-style:dashed}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.card{min-width:0;border-top:1px solid var(--line);padding-top:8px}
.cardhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px}
.cardhead h4{margin:0;font-size:.98rem}
.ctl{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.84rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:.82rem;background:transparent;color:var(--ink2);border:0;padding:3px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tline{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:1rem;margin:6px 0 2px}
.tline .sell,.tline .buy{white-space:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:4px 8px;margin:4px 0 0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--warn);background:var(--warnbg);border:1px solid var(--warnline);border-radius:999px;padding:1px 10px 1px 3px}
.bang{display:inline-grid;place-items:center;flex:none;width:16px;height:16px;border-radius:50%;background:var(--warn);color:var(--warnbg);font:700 11px/1 system-ui,sans-serif}
.good{color:var(--pos)} .bad{color:var(--neg)} .warn{color:var(--warn)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:.82rem;max-width:300px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:none}
.foot{color:var(--ink3);font-size:.76rem;margin:18px 0 0}
@media (max-width:520px){
  .wrap{padding:0 10px 20px}
  .pbody{padding:0 10px 12px}
  details.pair>summary{padding:9px 10px}
  table{font-size:.78rem}
  th,td{padding:4px 3px}
  td.l:first-child{white-space:nowrap}
  .chip{padding:0 6px;font-size:.74rem}
  .dot{margin-right:3px}
  #ovTable .dot{display:none}
  .chart{min-height:200px}
}
</style>

<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const FEE = 5.04, MINUS = '−';
const EXN = {binance:'Binance', okx:'OKX', gate:'Gate', bybit:'Bybit'};
const EXC = {binance:'var(--c-bn)', okx:'var(--c-okx)', gate:'var(--c-gate)'};
const exc = x => EXC[x] || 'var(--c-oth)';
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const SESN = ['основная сессия США', 'до/после основной сессии США', 'рынок акций США закрыт'];
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function nf(v, d) {
  if (v == null || !isFinite(v)) return '—';
  d = d == null ? 0 : d;
  const a = Math.abs(v), s = a.toLocaleString('ru-RU', {minimumFractionDigits:d, maximumFractionDigits:d});
  return (v < 0 && Number(a.toFixed(d)) !== 0 ? MINUS : '') + s;
}
const sg = (v, d) => (v > 0 && Number(v.toFixed(d == null ? 1 : d)) !== 0 ? '+' : '') + nf(v, d == null ? 1 : d);
const pc = (x, d) => nf(100 * x, d == null ? 0 : d) + ' %';
function pxf(v) {
  const a = Math.abs(v); let d = a >= 100 ? 2 : a >= 10 ? 3 : a >= 1 ? 4 : 5;
  const x = Number(v.toFixed(d)); while (d > 2 && Math.abs(Number(v.toFixed(d - 1)) - x) < 1e-12) d--;
  return nf(v, d);
}
const p2 = n => String(n).padStart(2, '0');
function tfmt(ms, withMs) {
  const d = new Date(ms);
  return p2(d.getUTCDate()) + '.' + p2(d.getUTCMonth() + 1) + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()) +
    (withMs ? '.' + String(d.getUTCMilliseconds()).padStart(3, '0') : '') + ' UTC (' + WD[d.getUTCDay()] + ')';
}
function durf(s) {
  if (s == null) return 'не сошлась';
  if (s < 1) return nf(s, 2) + ' с';
  if (s < 60) return nf(s, 1) + ' с';
  if (s < 3600) { const T = Math.round(s), m = Math.floor(T / 60); return m + ' мин ' + (T % 60) + ' с'; }
  const T = Math.round(s / 60), h = Math.floor(T / 60); return h + ' ч ' + (T % 60) + ' мин';
}
const spr = (b, a) => (a - b) / ((a + b) / 2) * 1e4;
const median = arr => { const s = [...arr].sort((a, b) => a - b), n = s.length; return n ? (s[Math.floor((n - 1) / 2)] + s[Math.floor(n / 2)]) / 2 : NaN; };
const exName = (P, leg) => EXN[leg === 'A' ? P.exA : P.exB] || (leg === 'A' ? P.exA : P.exB);
const tick = P => P.symA.replace(/-USDT-SWAP|USDT/, '').replace(/_$/, '');

// ---------- пометки сделок ----------
const FLAGS = {
  W: 'широкий спред',
  H: 'граница часа',
  C: 'рынок закрыт',
  S: 'нога стоит ≥ 10 мин',
  G: 'дыра данных'
};
function entrySpreads(e) { return [spr(e.p0[0], e.p0[1]), spr(e.p0[2], e.p0[3])]; }
function flagsOf(e) {
  const f = [], sp = entrySpreads(e), m = (e.t / 1000) % 3600;
  if (Math.max(sp[0], sp[1]) >= 100) f.push('W');
  if (m < 10 || m > 3590) f.push('H');
  if (e.ses === 2) f.push('C');
  if (Math.max(e.age0[0] || 0, e.age0[1] || 0) >= 600) f.push('S');
  if (e.hole || (e.aft != null && e.aft < 600)) f.push('G');
  return f;
}

const pairCache = {};
function stats(P) {
  if (pairCache[P.pair]) return pairCache[P.pair];
  const E = P.eps, C = E.filter(e => e.dur !== null);
  C.forEach(e => { e.net = e.pnl - FEE; e.fl = flagsOf(e); });
  const nets = C.map(e => e.net), sum = nets.reduce((a, b) => a + b, 0);
  const hour = C.filter(e => e.fl.includes('H')).reduce((a, e) => a + e.net, 0);
  P.ex.forEach(x => { x.ep = C.find(e => e.t === x.ep.t) || x.ep; });
  return pairCache[P.pair] = {n: E.length, nc: C.length, ncens: E.length - C.length, sum, mean: sum / C.length, med: median(nets), tmed: median(C.map(e => e.dur)), C, hourShare: hour / sum};
}

// ---------- сводка и навигация ----------
const exChips = P => `<span class="chip"><span class="dot" style="background:${exc(P.exA)}"></span>${EXN[P.exA]}</span> <span class="chip"><span class="dot" style="background:${exc(P.exB)}"></span>${EXN[P.exB]}</span>`;
function buildOverview() {
  let h = '<tr><th class="l">Пара</th><th class="l">Биржи</th><th>Сделок</th><th>Медиана, bps</th><th>Среднее, bps</th><th>Доля суммы: входы у начала часа ±10 с</th></tr>';
  D.pairs.forEach((P, i) => {
    const S = stats(P);
    h += `<tr class="rowlink" data-p="${P.pair}"><td class="l"><a href="#p${P.pair}">${i + 1} ${esc(tick(P))}</a></td><td class="l">${exChips(P)}</td>` +
      `<td>${S.n}</td><td>${sg(S.med, 1)}</td><td>${sg(S.mean, 1)}</td><td>${pc(S.hourShare)}</td></tr>`;
  });
  $('#ovTable').innerHTML = h;
  $('#jump').innerHTML = D.pairs.map((P, i) => `<a href="#p${P.pair}">${i + 1} ${esc(tick(P))}</a>`).join('');
}

// ---------- секции пар ----------
const lgd = (cls, style, txt) => `<span><i class="${cls}" style="${style}"></i>${txt}</span>`;
function pairSection(P, i) {
  const S = stats(P);
  const cards = P.ex.map((x, j) => `<div class="card" id="c${P.pair}_${j}"><div class="cardhead"><h4></h4><div class="ctl"></div></div><div class="chart" data-kind="ex" data-pair="${P.pair}" data-j="${j}"></div><div class="info"></div></div>`).join('');
  const histLegend = lgd('', 'background:var(--ink3)', 'размах за 10 мин') + lgd('r', 'background:var(--pos)', 'вход, плюс') + lgd('r', 'background:var(--neg)', 'вход, минус') +
    lgd('', 'background:var(--band-closed);border:1px solid var(--line)', 'рынок закрыт') + lgd('', 'background:var(--band-ext);border:1px solid var(--line)', 'вне основной сессии') +
    lgd('', 'background:repeating-linear-gradient(45deg,var(--hole) 0 2px,transparent 2px 5px)', 'дыра данных') + '<span>пунктир — порог ±12,6 bps</span>';
  const exLegend = [P.exA, P.exB].map(x => lgd('', 'background:' + exc(x), EXN[x])).join('') + lgd('ln', '', 'аск') + lgd('ln d', '', 'бид') + '<span>▼ продажа · ▲ покупка · залит — вход, пуст — выход</span>';
  return `<details class="pair" id="p${P.pair}"${i === 0 ? ' open' : ''}>
  <summary><span class="num">${i + 1}</span><b class="tk">${esc(tick(P))}</b>${exChips(P)}<span class="st"><b>${S.n}</b> сделок</span><span class="st">мед. <b>${sg(S.med, 1)}</b> · ср. <b>${sg(S.mean, 1)}</b> bps</span><span class="st">мед. время <b>${durf(S.tmed)}</b></span></summary>
  <div class="pbody">
  <h3>Разрыв между биржами, 14 суток</h3>
  <div class="chart" data-kind="hist" data-pair="${P.pair}"></div>
  <div class="legend">${histLegend}</div>

  const pw = W - m.l - m.r, ph = H - m.t - m.b, bw = pw / BINS.length, cm = Math.max(...cnt, 1);

    if (cnt[i]) s += `<rect x="${(x + 2).toFixed(1)}" y="${(m.t + ph - h).toFixed(1)}" width="${Math.max(2, bw - 4).toFixed(1)}" height="${h.toFixed(1)}" fill="${col}" fill-opacity=".82"><title>${b[2]} bps: ${cnt[i]} сделок</title></rect><text class="ax" x="${(x + bw / 2).toFixed(1)}" y="${(m.t + ph - h - 4).toFixed(1)}" text-anchor="middle" style="fill:var(--ink)">${cnt[i]}</text>`;
