<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Монеты и плотности</title>
<style>
:root{--bg:#0d1117;--panel:#111720;--ink:#c9d1d9;--bright:#e6edf3;--muted:#7d8590;--line:#1e2530;
--eaten:#3fb950;--pulled:#6e7681;--mixed:#d29922;--alive:#58a6ff;--bad:#f85149;--ok:#3fb950;
--bounced:#3fb950;--teaten:#f85149;--fr:rgba(210,153,34,.30)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* Сетка плиток на всю ширину окна: ряды и столбцы считает JS ровно под число
монет, чтобы экран был занят целиком и без полосы прокрутки. */
.grid{display:grid;gap:3px;height:100vh;
grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));
grid-template-rows:repeat(var(--rows,3),minmax(0,1fr))}
body.solo .grid{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
body.solo .tile{display:none}
body.solo .tile.solo{display:flex}
.tile{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;
background:var(--panel);border:1px solid var(--line);border-radius:3px}
.hd{flex:0 0 auto;display:flex;gap:9px;align-items:baseline;padding:2px 6px 1px;
font-size:11px;line-height:1.45;white-space:nowrap;overflow:hidden;cursor:zoom-in}
.hd .sym{font-weight:700;font-size:12.5px;color:var(--bright);letter-spacing:.2px}
.hd .px{font-variant-numeric:tabular-nums;color:var(--bright)}
.hd .kv{color:var(--muted)}
.hd .kv b{color:var(--ink);font-weight:600}
.hd .err{color:var(--bad)}
.cv{position:relative;flex:1 1 auto;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;background:var(--bg)}
.tip{position:absolute;pointer-events:none;background:#1c2430;color:#e6edf3;font-size:11.5px;line-height:1.4;
padding:4px 7px;border-radius:4px;border:1px solid #2b3441;max-width:340px;z-index:6}
/* В углу графика — только предупреждение о потолке рисования (в окне
   больше полосок/касаний, чем страница берёт). Обычной сводки тут нет:
   страница = сетка графиков. */
.warn{position:absolute;right:4px;top:2px;font-size:9.5px;color:#d29922;pointer-events:none;
background:rgba(13,17,23,.7);padding:0 3px;border-radius:2px;max-width:calc(100% - 60px);
overflow:hidden;white-space:nowrap}
/* Коллектор жив/не пишет — цветом рамки плитки и заголовком окна, без панели. */
body.dead .tile{border-color:#5c2b2b}
body.dead .hd .sym::after{content:' · коллектор не пишет';color:#f85149;font-weight:400;font-size:10.5px}
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="application/json" id="bootstrap">__BOOTSTRAP_JSON__</script>
<script>
'use strict';
const REFRESH = __REFRESH_SECS__;
let D = JSON.parse(document.getElementById('bootstrap').textContent);
// Состояние графика на монету: symbol → типизированные массивы, индексы, окно.
const CH = new Map();
const FLT = {o:[true,true,true,true],touch:true}; // фильтры исходов и касаний
let SOLO = null;                                  // монета, развёрнутая на весь экран
// Цвета полосок — сторона стакана (canvas переменных CSS не читает): бид
// снизу, аск сверху — так на картинке читается сам стакан, а исход уровня
// живёт в метках касаний. Яркость и толщина полоски — ранг размера.
const SIDECOL = ['#2f81f7','#f0883e'];
const OUTNAME = ['проели','сняли','смешанно','живой'];
const SIDENAME = ['бид (покупка)','аск (продажа)'];
const TOUCHCOL = ['#3fb950','#f85149'];
const TOUTNAME = ['отскочила','проели на касании'];
const MAX = D.chart_max_drawn;
// Потолок нарисованных касаний в окне: их бывает десятки тысяч (LSK: 77 125
// за запись), а метка — событие штучное; в окне часа их сотни.
const TOUCH_MAX = 900;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f = (v, d=2) => (v===null||v===undefined||Number.isNaN(v)) ? '—' : Number(v).toFixed(d);
const pct = v => v===null||v===undefined ? '—' : (100*v).toFixed(1)+' %';
const px = (v, dec) => v===null||v===undefined ? '—' : Number(v).toFixed(dec);
const dur = s => s<60 ? Math.round(s)+' с' : s<3600 ? Math.round(s/60)+' мин' : (s/3600).toFixed(1)+' ч';
const ms = v => v===null||v===undefined ? '—' : (v<1000 ? Math.round(v)+' мс' : v<60000 ? (v/1000).toFixed(1)+' с' : v<3600000 ? (v/60000).toFixed(1)+' мин' : (v/3600000).toFixed(1)+' ч');
const p2 = n => String(n).padStart(2,'0');
const hhmm = t => { const d=new Date(t); return p2(d.getUTCHours())+':'+p2(d.getUTCMinutes()); };
const hhmmss = t => hhmm(t)+':'+p2(new Date(t).getUTCSeconds());
const ddmm = t => { const d=new Date(t); return p2(d.getUTCDate())+'.'+p2(d.getUTCMonth()+1); };

// ---------------------------------------------------------------------------
// Сетка: столбцы и ряды — ровно под число монет (пустых клеток нет), плитки
// делят экран поровну; из двух раскладок берём ту, где плитка крупнее.
// ---------------------------------------------------------------------------
function layout(){
  const n = Math.max(1, (D.coins||[]).length);
  const W = window.innerWidth, H = window.innerHeight;
  let best = {cols:1, rows:n, score:-1};
  for (let cols=1; cols<=n; cols++){
    const rows = Math.ceil(n/cols);
    const waste = cols*rows - n;                // пустые клетки последнего ряда
    const ar = (W/cols)/(H/rows);               // пропорция плитки
    if (ar < 0.45 || ar > 3.2) continue;        // слишком вытянутые не берём
    const area = (W/cols)*(H/rows);
    const score = area * Math.min(ar, 1/ar) / (1 + 4*waste);
    if (score > best.score) best = {cols, rows, score};
  }
  grid.style.setProperty('--cols', best.cols);
  grid.style.setProperty('--rows', best.rows);
}

// ---------------------------------------------------------------------------
// Плитки
// ---------------------------------------------------------------------------
const grid = document.getElementById('grid');
const IO = new IntersectionObserver(es => es.forEach(e => {
  const st = CH.get(e.target.dataset.sym); if (!st) return;
  st.visible = e.isIntersecting;
  if (e.isIntersecting && !st.loaded && !st.loading && !st.error) loadCoin(st);
}), {rootMargin:'200px'});

function render(){
  renderStatus();
  layout();
  const seen = new Set();
  for (const co of D.coins){
    seen.add(co.symbol);
    const t = tileFor(co);
    grid.appendChild(t);
    const st = CH.get(co.symbol);
    st.co = co;
    if (co.error) st.error = 'не прочитан: '+co.error;
    t.querySelector('.hd').innerHTML = headHtml(co);
    t.classList.toggle('solo', SOLO===co.symbol);
    schedule(st);
  }
  for (const [sym, st] of CH) if (!seen.has(sym)) { st.tile.remove(); CH.delete(sym); }
  document.body.classList.toggle('solo', SOLO!==null);
}

function tileFor(co){
  let t = document.getElementById('t-'+co.symbol);
  if (t) return t;
  t = document.createElement('div'); t.className='tile'; t.id='t-'+co.symbol; t.dataset.sym=co.symbol;
  t.innerHTML = '<div class="hd"></div><div class="cv"><canvas></canvas><div class="warn" hidden></div><div class="tip" hidden></div></div>';
  t.querySelector('.hd').onclick = () => { SOLO = SOLO===co.symbol ? null : co.symbol; render(); };
  const cv = t.querySelector('canvas');
  const st = {sym:co.symbol, tile:t, cv, ctx:cv.getContext('2d'), note:t.querySelector('.warn'), tip:t.querySelector('.tip'),
    co, loaded:false, loading:false, error:null, visible:false, view:null, raf:0, hit:null, drag:null};
  CH.set(co.symbol, st);
  bindEvents(st);
  grid.appendChild(t);
  IO.observe(t);
  return t;
}

// Шапка плитки — одна строка и только то, что видно на графике: цена,
// сколько плотностей живо сейчас, сколько касаний и какая доля отскочила.
function headHtml(co){
  if (co.error) return '<span class="sym">'+esc(co.symbol)+'</span><span class="err">не прочитан: '+esc(co.error)+'</span>';
  const now = co.levels_now.length, bids = co.levels_now.filter(l=>l.side==='bid').length;
  return '<span class="sym">'+esc(co.symbol)+'</span>'+
    '<span class="px">'+px(co.bid,co.price_decimals)+' / '+px(co.ask,co.price_decimals)+'</span>'+
    '<span class="kv">плотностей <b>'+now+'</b> ('+bids+'/'+(now-bids)+')</span>'+
    '<span class="kv">касаний <b>'+co.touches.total+'</b>'+(co.touches.share_bounced!==null?' · отскок <b>'+pct(co.touches.share_bounced)+'</b>':'')+'</span>';
}

// Коллектор пишет или нет — рамкой плиток (`body.dead`) и заголовком окна:
// на самой странице текста о процессе нет, страница = сетка графиков.
function renderStatus(){
  const c = D.collector;
  const alive = c.alive===null ? 'жив ли — узнаем на следующем расчёте' : (c.alive ? 'коллектор пишет' : 'коллектор НЕ пишет');
  document.body.classList.toggle('dead', c.alive===false);
  document.title = 'Монеты и плотности · '+alive+' · записано '+dur(c.recorded_secs)+' · '+c.instruments+' монет · разрывов '+c.gaps_on_disk;
}

// ---------------------------------------------------------------------------
// Данные графика: coin-<SYMBOL>.json → типизированные массивы и индексы
// ---------------------------------------------------------------------------
function loadCoin(st){
  if (!st.co || st.co.error) return;
  st.loading = true;
  fetch(st.co.chart_file, {cache:'no-store'})
    .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(j => { st.loading=false; prepare(st, j); schedule(st); })
    .catch(e => { st.loading=false; if (!st.loaded) st.error='график не загружен ('+e.message+')'; schedule(st); });
}

// Нижняя граница: первый индекс с a[i] >= v.
function lowerBound(a, v){ let lo=0, hi=a.length; while (lo<hi){ const m=(lo+hi)>>1; if (a[m]<v) lo=m+1; else hi=m; } return lo; }

function prepare(st, j){
  const oldTo = st.loaded ? st.to : null;
  st.t0=j.t0; st.from=j.from_ms; st.to=j.to_ms; st.dec=j.price_decimals; st.h3=j.h3_lots;
  if (j.error){ st.error='не прочитан: '+j.error; st.loaded=false; return; }
  if (!j.mid.length){ st.error='нет срезов середины'; st.loaded=false; return; }
  st.error=null;
  const t0=j.t0;
  const nm=j.mid.length; st.mt=new Float64Array(nm); st.mp=new Float64Array(nm);
  for (let i=0;i<nm;i++){ st.mt[i]=t0+j.mid[i][0]; st.mp[i]=j.mid[i][1]; }
  const n=j.bars.length; st.n=n;
  st.bb=new Float64Array(n); st.bd=new Float64Array(n); st.bp=new Float64Array(n); st.bs=new Uint8Array(n); st.bo=new Uint8Array(n); st.bx=new Float32Array(n); st.bm=new Float32Array(n); st.bw=new Float32Array(n); st.ba=new Float32Array(n);
  for (let i=0;i<n;i++){ const b=j.bars[i]; st.bb[i]=t0+b[0]; st.bd[i]=b[1]===null?Infinity:t0+b[1]; st.bp[i]=b[2]; st.bs[i]=b[3]; st.bo[i]=b[4]; st.bx[i]=b[5]; st.bm[i]=b[6]===null?NaN:b[6]; }
  // Ранг размера — по всем полоскам монеты: при отладочном пороге (k = 1.0)
  // ×H3 у всех огромен, и линейная шкала слепнет. Толщина и яркость — от ранга.
  st.sx = Float32Array.from(st.bx).sort();
  let maxX = 0;
  for (let i=0;i<n;i++){ const r = n ? lowerBound(st.sx, st.bx[i])/n : 0; st.ba[i]=r; st.bw[i]=0.7+4.3*r*r; if (st.bx[i]>maxX) maxX=st.bx[i]; }
  st.maxX = maxX;
  const k=j.touches.length; st.k=k;
  st.tt=new Float64Array(k); st.tp=new Float64Array(k); st.ts=new Uint8Array(k); st.tu=new Uint8Array(k); st.ta=new Float64Array(k); st.tx=new Float32Array(k);
  st.tfr=new Float32Array(k); st.tsw=new Float32Array(k); st.tap=new Float32Array(k); st.ti=new Uint32Array(k); st.td=new Float64Array(k); st.tm=new Float32Array(k);
  for (let i=0;i<k;i++){ const t=j.touches[i]; st.tt[i]=t0+t[0]; st.tp[i]=t[1]; st.ts[i]=t[2]; st.tu[i]=t[3]; st.ta[i]=t[4]; st.tx[i]=t[5];
    st.tfr[i]=t[6]===null?NaN:t[6]; st.tsw[i]=t[7]===null?NaN:t[7]; st.tap[i]=t[8]===null?NaN:t[8]; st.ti[i]=t[9]; st.td[i]=t[10]; st.tm[i]=t[11]===null?NaN:t[11]; }
  st.levels = j.levels || []; st.stabs = j.stabs || [];
  st.barsTotal = j.bars_total; st.touchesTotal = j.touches_total;
  // Индекс по времени: корзины по span/2000 (не меньше минуты); полоска лежит во
  // всех корзинах своей жизни, касание — в корзине начала. Живые — до конца записи.
  st.bk = Math.max(60000, (st.to-st.from)/2000);
  const nb = Math.floor((st.to-st.from)/st.bk)+1;
  const bi = Array.from({length:nb}, ()=>[]), ti = Array.from({length:nb}, ()=>[]);
  const bkOf = t => Math.min(nb-1, Math.max(0, Math.floor((t-st.from)/st.bk)));
  for (let i=0;i<n;i++){ const a=bkOf(st.bb[i]), b=bkOf(st.bd[i]===Infinity?st.to:st.bd[i]); for (let c=a;c<=b;c++) bi[c].push(i); }
  for (let i=0;i<k;i++) ti[bkOf(st.tt[i])].push(i);
  st.bIdx = bi.map(a=>Int32Array.from(a)); st.tIdx = ti.map(a=>Int32Array.from(a)); st.bkOf = bkOf;
  st.stamp = new Int32Array(n); st.cur = 0;
  st.loaded = true;
  // Окно: при первой загрузке — последний час; при перечитывании — прежнее,
  // а если стояли у правого края — едем за записью.
  if (!st.view) resetView(st);
  else if (oldTo!==null && st.view.to >= oldTo-1000){ const span=st.view.to-st.view.from; st.view={from:Math.max(st.from, st.to-span), to:st.to}; }
}

function resetView(st){
  const to = st.to, from = Math.max(st.from, to - D.chart_start_minutes*60000);
  setView(st, from, to);
}

function clampView(st, from, to){
  let span = Math.min(Math.max(to-from, 10000), Math.max(st.to-st.from, 10000));
  if (from < st.from) from = st.from;
  if (from+span > st.to) from = Math.max(st.from, st.to-span);
  return {from, to: from+span};
}

function setView(st, from, to){ st.view = clampView(st, from, to); schedule(st); }

// ---------------------------------------------------------------------------
// Рисование
// ---------------------------------------------------------------------------
function schedule(st){ if (!st.raf) st.raf = requestAnimationFrame(()=>{ st.raf=0; draw(st); }); }

const STEPS = [1e3,2e3,5e3,10e3,15e3,30e3,60e3,120e3,300e3,600e3,900e3,1800e3,3600e3,7200e3,10800e3,21600e3,43200e3,86400e3];
const PROFILE_W = 46;   // ширина полосы профиля стакана справа, px
const PROF_ROWS = 140;  // строк профиля по цене

function draw(st){
  const cv=st.cv, dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  if (!W || !H) return;
  if (cv.width!==Math.round(W*dpr) || cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
  const g=st.ctx; g.setTransform(dpr,0,0,dpr,0,0);
  g.globalCompositeOperation='source-over'; g.globalAlpha=1; g.setLineDash([]);
  g.fillStyle='#0d1117'; g.fillRect(0,0,W,H);
  g.font='10.5px system-ui,sans-serif';
  if (!st.loaded){
    g.fillStyle='#7d8590'; g.textAlign='center'; g.fillText(st.error ? st.error : (st.loading ? 'график загружается…' : 'график ещё не запрошен'), W/2, H/2);
    st.note.textContent=''; st.hit=null; return;
  }
  const v=st.view, from=v.from, to=v.to, span=to-from;
  // Диапазон цены — по середине в окне ± последняя корзина расстояния (25 bps).
  let i0=lowerBound(st.mt, from), i1=lowerBound(st.mt, to+1);
  if (i1<=i0){ i0=Math.max(0,i0-1); i1=Math.min(st.mt.length, i0+2); }
  let lo=Infinity, hi=-Infinity;
  for (let i=i0;i<i1;i++){ const p=st.mp[i]; if (p<lo) lo=p; if (p>hi) hi=p; }
  const pad=D.chart_price_pad_bps/1e4;
  let plo=lo*(1-pad), phi=hi*(1+pad);
  if (!(phi>plo)){ plo=lo-Math.pow(10,-st.dec); phi=hi+Math.pow(10,-st.dec); }
  const L=4, T=4, B=15, R=Math.ceil(g.measureText(phi.toFixed(st.dec)).width)+11;
  const pw=Math.max(10, W-L-R), ph=Math.max(10, H-T-B);
  const x = t => L + (t-from)/span*pw;
  const y = p => T + (phi-p)/(phi-plo)*ph;
  // Сетка: цена справа, время снизу (UTC) — тем же шагом, что разметка времени.
  g.strokeStyle='#161c25'; g.lineWidth=1;
  for (let i=0;i<=4;i++){ const Y=Math.round(y(plo+(phi-plo)*i/4))+0.5; g.beginPath(); g.moveTo(L,Y); g.lineTo(L+pw,Y); g.stroke(); }
  let step=STEPS[STEPS.length-1];
  for (const s of STEPS) if (span/s <= pw/64){ step=s; break; }
  for (let t=Math.ceil(from/step)*step; t<=to; t+=step){ const X=Math.round(x(t))+0.5; g.beginPath(); g.moveTo(X,T); g.lineTo(X,T+ph); g.stroke(); }
  // Полоски окна — из индекса по времени, не перебором всего массива.
  const cur=++st.cur, stamp=st.stamp, bb=st.bb, bd=st.bd, bp=st.bp, bo=st.bo, bx=st.bx, ba=st.ba;
  const list=[]; let inWin=0, clipped=0;
  const b0=st.bkOf(from), b1=st.bkOf(to);
  for (let c=b0;c<=b1;c++){ const arr=st.bIdx[c]; for (let q=0;q<arr.length;q++){ const i=arr[q];
    if (stamp[i]===cur) continue;
    stamp[i]=cur;
    const b=bb[i], d=bd[i]; if (b>to || d<from) continue;
    if (!FLT.o[bo[i]]) continue;
    inWin++; const p=bp[i]; if (p<plo||p>phi){ clipped++; continue; }
    list.push(i);
  }}
  const capped = list.length>MAX;
  if (capped){ list.sort((a,b)=>bx[b]-bx[a]); list.length=MAX; }
  list.sort((a,b)=>bx[a]-bx[b]); // тонкие снизу, толстые сверху
  const hit={cw:6, cols:[]}; const ncol=Math.ceil(W/hit.cw)+1; for (let c=0;c<ncol;c++) hit.cols.push([]);
  const colOf = X => Math.min(ncol-1, Math.max(0, Math.floor(X/hit.cw)));
  const liveEnd = x(Math.min(to, st.to));
  // Полоса профиля справа — своя зона: данные (полоски, середина, касания)
  // рисуются с обрезкой по ней, чтобы профиль ничего не затирал.
  const stripX = L+pw-PROFILE_W, dataR = stripX-3;
  // Окно стоит у конца записи: только тогда «живые» полоски файла относятся
  // к видимому времени (профиль и кромка живых плотностей).
  const nearEnd = (st.to - to) <= 120000;
  g.save(); g.beginPath(); g.rect(L,T,Math.max(1,dataR-L),ph); g.clip();
  // Полоски плотностей: цвет — сторона, толщина и яркость — ранг размера.
  // Поле полупрозрачное (важна форма стакана), а сверху ещё раз проходятся
  // самые крупные — «стены», ради которых всё и смотрится.
  for (const i of list){
    const x1=Math.max(L, x(bb[i])); if (x1>dataR) continue;
    let x2 = bd[i]===Infinity ? liveEnd : x(bd[i]); x2=Math.min(dataR, Math.max(x1+1.5, x2));
    const Y=y(bp[i]), r=ba[i];
    g.globalAlpha = 0.10 + 0.42*r;
    g.strokeStyle=SIDECOL[st.bs[i]]; g.lineWidth=0.5+2.8*r*r;
    g.beginPath(); g.moveTo(x1,Y); g.lineTo(x2,Y); g.stroke();
    const e={k:0,i,x1,x2,y:Y,w:0.5+2.8*r*r}; for (let c=colOf(x1);c<=colOf(x2);c++) hit.cols[c].push(e);
  }
  g.globalAlpha=1;
  // «Стены»: сотня самых крупных полосок окна — плотной линией поверх поля.
  // Живые стены видны не пунктиром, а яркой кромкой у правого края (ниже).
  const walls = list.length>100 ? list.slice(Math.max(0, list.length-100)) : [];
  for (const i of walls){
    const x1=Math.max(L, x(bb[i])); if (x1>dataR) continue;
    let x2 = bd[i]===Infinity ? liveEnd : x(bd[i]); x2=Math.min(dataR, Math.max(x1+1.5, x2));
    const Y=y(bp[i]);
    g.globalAlpha=0.95; g.strokeStyle=SIDECOL[st.bs[i]]; g.lineWidth=1.2+4.2*ba[i];
    g.beginPath(); g.moveTo(x1,Y); g.lineTo(x2,Y); g.stroke();
  }
  g.globalAlpha=1;
  // Живые плотности — яркая кромка у правого края окна: «что стоит сейчас».
  if (nearEnd){
    const lastC = st.bIdx[st.bkOf(Math.min(to, st.to))];
    if (lastC) for (let q=0;q<lastC.length;q++){ const i=lastC[q]; if (bd[i]!==Infinity) continue;
      const Y=y(bp[i]); if (Y<T-2||Y>T+ph+2) continue;
      g.globalAlpha=0.55+0.45*ba[i]; g.strokeStyle=SIDECOL[st.bs[i]]; g.lineWidth=1.4+2.2*ba[i];
      g.beginPath(); g.moveTo(Math.max(L,dataR-5),Y); g.lineTo(dataR,Y); g.stroke(); }
    g.globalAlpha=1;
  }
  g.restore();
  // Профиль стакана справа: суммарный размер **живых** плотностей по цене —
  // «где стоят плотности сейчас»; видно и завал (сплошная широкая полоса), и
  // пустые участки. Живые полоски в файле — те, что живы на последнем кадре
  // записи, поэтому профиль рисуется только у конца записи.
  const profB = new Float64Array(PROF_ROWS), profA = new Float64Array(PROF_ROWS);
  let profMax=0, profN=0;
  if (nearEnd){
    const last = st.bIdx[st.bkOf(Math.min(to, st.to))];
    if (last) for (let q=0;q<last.length;q++){ const i=last[q]; if (bd[i]!==Infinity) continue;
      const row = Math.min(PROF_ROWS-1, Math.max(0, Math.floor((phi-bp[i])/(phi-plo)*PROF_ROWS)));
      const acc = st.bs[i]===0 ? profB : profA;
      acc[row] += bx[i]; profN++; if (acc[row]>profMax) profMax=acc[row]; } }
  if (profMax>0){
    const rowH=ph/PROF_ROWS;
    for (const [arr, col] of [[profB,'#2f81f7'],[profA,'#f0883e']]){
      g.fillStyle=col; g.globalAlpha=0.75;
      for (let r=0;r<PROF_ROWS;r++){ const s=arr[r]; if (!s) continue;
        g.fillRect(stripX+PROFILE_W*(1-s/profMax), T+r*rowH, Math.max(1,PROFILE_W*(s/profMax)), rowH+0.5); }
      g.globalAlpha=1;
    }
    g.strokeStyle='#2b3441'; g.lineWidth=1; g.beginPath(); g.moveTo(stripX-0.5,T); g.lineTo(stripX-0.5,T+ph); g.stroke();
  }
  // Слой T39: уровни пунктиром и метки закола — данных пока нет, рисовалка есть.
  for (const lv of st.levels){ const a=st.t0+lv[0], b=lv[1]===null?st.to:st.t0+lv[1]; if (b<from||a>to) continue; const Y=y(lv[2]); if (Y<T||Y>T+ph) continue;
    g.strokeStyle='#a371f7'; g.lineWidth=1; g.setLineDash([2,3]); g.beginPath(); g.moveTo(Math.max(L,x(a)),Y); g.lineTo(Math.min(dataR,x(b)),Y); g.stroke(); g.setLineDash([]);
    if (lv[4]){ g.fillStyle='#a371f7'; g.textAlign='left'; g.textBaseline='middle'; g.fillText(lv[4], Math.max(L,x(a))+2, Y-3); } }
  for (const sb of st.stabs){ const t=st.t0+sb[0]; if (t<from||t>to) continue; const X=x(t), Y=y(sb[1]); if (Y<T||Y>T+ph) continue;
    g.fillStyle='#a371f7'; g.beginPath(); g.moveTo(X,Y-5); g.lineTo(X+4,Y); g.lineTo(X,Y+5); g.lineTo(X-4,Y); g.closePath(); g.fill(); }
  // Середина: белая линия; при точках гуще двух на пиксель — огибающая min/max.
  g.save(); g.beginPath(); g.rect(L,T,Math.max(1,dataR-L),ph); g.clip();
  g.strokeStyle='#ffffff'; g.lineWidth=1.5; g.globalAlpha=0.95; g.beginPath();
  if (i1-i0 > 2*pw){
    let col=-1, cmin=0, cmax=0, started=false;
    for (let i=i0;i<i1;i++){ const c=Math.floor(x(st.mt[i])), p=st.mp[i];
      if (c!==col){ if (col>=0){ const X=col+0.5; if (!started){ g.moveTo(X,y(cmin)); started=true; } else g.lineTo(X,y(cmin)); g.lineTo(X,y(cmax)); } col=c; cmin=p; cmax=p; }
      else { if (p<cmin) cmin=p; if (p>cmax) cmax=p; } }
    if (col>=0){ const X=col+0.5; if (!started) g.moveTo(X,y(cmin)); else g.lineTo(X,y(cmin)); g.lineTo(X,y(cmax)); }
  } else {
    const a=Math.max(0,i0-1), b=Math.min(st.mt.length, i1+1);
    for (let i=a;i<b;i++){ const X=x(st.mt[i]), Y=y(st.mp[i]); if (i===a) g.moveTo(X,Y); else g.lineTo(X,Y); }
  }
  g.stroke(); g.globalAlpha=1; g.restore();
  // Касания: треугольник у начала на цене уровня (вверх — бид, вниз — аск),
  // цвет — исход; 4-е касание и дальше — контуром (у практиков это уже
  // «начинают трахать»). Перед полоской — тонкая зона фронтрана за секунду.
  let nt=0, tcl=0, tcapped=false, tInWin=0;
  const tl=[];
  if (FLT.touch && st.k){
    const tt=st.tt, tp=st.tp, tx=st.tx;
    for (let c=b0;c<=b1;c++){ const arr=st.tIdx[c]; for (let q=0;q<arr.length;q++){ const i=arr[q]; const t=tt[i]; if (t<from||t>to) continue;
      const p=tp[i]; if (p<plo||p>phi){ tcl++; continue; } tl.push(i); } }
    if (tl.length>TOUCH_MAX){ tInWin=tl.length; tl.sort((a,b)=>tx[b]-tx[a]); tl.length=TOUCH_MAX; tcapped=true; }
    g.save(); g.beginPath(); g.rect(L,T,Math.max(1,dataR-L),ph); g.clip();
    for (const i of tl){
      const X=x(tt[i]), Y=y(tp[i]), up=st.ts[i]===0; nt++;
      const fr=st.tfr[i];
      if (fr>0){ const hh=2+6*Math.min(fr,1), ww=Math.max(2, x(tt[i]+st.td[i])-X); g.fillStyle='#d29922'; g.globalAlpha=0.20; g.fillRect(X, up ? Y-1-hh : Y+1, Math.min(ww, dataR-X), hh); g.globalAlpha=1; }
      const sz=3.2;
      g.strokeStyle='#0d1117'; g.lineWidth=0.7; g.fillStyle=TOUCHCOL[st.tu[i]];
      g.beginPath();
      if (up){ g.moveTo(X,Y-sz); g.lineTo(X-sz*0.85,Y+sz*0.7); g.lineTo(X+sz*0.85,Y+sz*0.7); }
      else { g.moveTo(X,Y+sz); g.lineTo(X-sz*0.85,Y-sz*0.7); g.lineTo(X+sz*0.85,Y-sz*0.7); }
      g.closePath();
      if (st.ti[i]>=3){ g.strokeStyle=TOUCHCOL[st.tu[i]]; g.lineWidth=1.1; g.stroke(); } else { g.fill(); g.stroke(); }
      hit.cols[colOf(X)].push({k:1,i,x:X,y:Y});
    }
    g.restore();
  }
  st.hit=hit; st.geom={L,T,pw,ph,from,span};
  // Оси — поверх всего, чтобы подписи читались.
  g.fillStyle='#7d8590'; g.textAlign='left'; g.textBaseline='middle';
  for (let i=0;i<=4;i++){ const p=plo+(phi-plo)*i/4; g.fillText(p.toFixed(st.dec), L+pw+4, Math.round(y(p))+0.5); }
  g.textAlign='center'; g.textBaseline='alphabetic';
  for (let t=Math.ceil(from/step)*step; t<=to; t+=step){ const X=Math.round(x(t))+0.5; const day = t % 86400e3 === 0;
    g.fillText(day ? ddmm(t)+' '+hhmm(t) : (step<60e3 ? hhmmss(t) : hhmm(t)), X, H-4); }
  // В углу — только предупреждение о потолке: сколько полосок/касаний в окне
  // страница не рисует. Обычной сводки на графике нет.
  const warn = [];
  if (capped) warn.push('в окне '+inWin.toLocaleString('ru-RU')+' полосок — рисуются '+list.length.toLocaleString('ru-RU')+' крупнейших');
  if (tcapped) warn.push('касаний '+tInWin.toLocaleString('ru-RU')+' — рисуются '+nt.toLocaleString('ru-RU'));
  if (clipped) warn.push('за диапазоном цены полосок '+clipped.toLocaleString('ru-RU'));
  st.note.textContent = warn.join(' · ');
  st.note.hidden = warn.length===0;
}

// ---------------------------------------------------------------------------
// Интерактив: колесо — зум, тянуть — панорама, двойной клик — сброс, наведение — цифры
// ---------------------------------------------------------------------------
function bindEvents(st){
  const cv=st.cv;
  const timeAt = mx => { const gm=st.geom; return gm.from + (mx-gm.L)/gm.pw*gm.span; };
  cv.addEventListener('wheel', e => {
    if (!st.loaded || !st.geom) return; e.preventDefault();
    const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, tc=timeAt(mx);
    const dy = e.deltaMode===1 ? e.deltaY*33 : e.deltaY; // Firefox: строки, не пиксели
    const k=Math.exp(dy*0.0015);
    const v=st.view; setView(st, tc-(tc-v.from)*k, tc+(v.to-tc)*k);
    hideTip(st);
  }, {passive:false});
  cv.addEventListener('pointerdown', e => {
    if (!st.loaded || !st.geom || e.button!==0) return;
    st.drag={x:e.clientX, from:st.view.from, to:st.view.to}; cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (!st.loaded || !st.geom) return;
    const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    if (st.drag){
      const dx=e.clientX-st.drag.x; const dt=-dx/st.geom.pw*st.geom.span;
      setView(st, st.drag.from+dt, st.drag.to+dt); hideTip(st); return;
    }
    hover(st, mx, my);
  });
  const up = e => { if (st.drag){ st.drag=null; try{ cv.releasePointerCapture(e.pointerId); }catch(_){} } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', () => { if (!st.drag) hideTip(st); });
  cv.addEventListener('dblclick', e => { e.preventDefault(); if (st.loaded) resetView(st); });
}
function hideTip(st){ st.tip.hidden=true; }
function hover(st, mx, my){
  const hit=st.hit; if (!hit) return;
  const c=Math.floor(mx/hit.cw); let best=null, bd=1e9;
  for (let q=c-1;q<=c+1;q++){ const col=hit.cols[q]; if (!col) continue; for (const e of col){
    if (e.k===1){ const d=Math.hypot(mx-e.x, my-e.y); if (d<=9 && d-3<bd){ bd=d-3; best=e; } }
    else { if (mx<e.x1-2||mx>e.x2+2) continue; const d=Math.abs(my-e.y); if (d<=Math.max(4,e.w) && d<bd){ bd=d; best=e; } } } }
  if (!best){ hideTip(st); return; }
  let text;
  if (best.k===0){
    const i=best.i, alive=st.bd[i]===Infinity;
    text = SIDENAME[st.bs[i]]+' '+st.bp[i].toFixed(st.dec)+' · '+OUTNAME[st.bo[i]]+' · '+(alive ? 'жив с '+hhmmss(st.bb[i]) : hhmmss(st.bb[i])+'–'+hhmmss(st.bd[i])+', '+ms(st.bd[i]-st.bb[i]))+
      ' · размер '+st.bx[i].toFixed(1)+'×H3'+(Number.isNaN(st.bm[i])?'':' · m 10 с '+st.bm[i].toFixed(2)+' bps');
  } else {
    const i=best.i, inside = st.td[i] >= D.horizons_ms[2];
    text = 'касание '+hhmmss(st.tt[i])+' UTC · '+SIDENAME[st.ts[i]]+' '+st.tp[i].toFixed(st.dec)+' · '+TOUTNAME[st.tu[i]]+' · '+(st.ti[i]+1)+'-е касание уровня · возраст '+ms(st.ta[i])+' · длилось '+ms(st.td[i])+
      ' · размер '+st.tx[i].toFixed(1)+'×H3 · фронтран за 1 с '+(Number.isNaN(st.tfr[i])?'—':st.tfr[i].toFixed(2)+' размера')+' · сметено '+(Number.isNaN(st.tsw[i])?'—':st.tsw[i].toFixed(2)+' размера')+
      ' · подход 1 с '+(Number.isNaN(st.tap[i])?'—':st.tap[i].toFixed(2)+' bps')+' · m 10 с '+(inside ? 'внутри касания' : (Number.isNaN(st.tm[i])?'—':st.tm[i].toFixed(2)+' bps'));
  }
  const tip=st.tip; tip.textContent=text; tip.hidden=false;
  const W=st.cv.clientWidth; tip.style.left = Math.min(mx+12, Math.max(0, W-tip.offsetWidth-4))+'px'; tip.style.top = (my+14)+'px';
}

// ---------------------------------------------------------------------------
// Старт и обновление: data.json раз в REFRESH с, coin-*.json раз в chart_refresh_secs
// ---------------------------------------------------------------------------
render();
window.addEventListener('resize', () => { layout(); CH.forEach(schedule); });
setInterval(()=>{
  fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ if(j){ D=j; render(); } }).catch(()=>{});
}, REFRESH*1000);
setInterval(()=>{
  for (const st of CH.values()) if (st.loaded && !st.loading && (st.visible || SOLO===st.sym)) loadCoin(st);
}, D.chart_refresh_secs*1000);
</script>
</body>
