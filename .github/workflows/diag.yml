name: Diag
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Кто мы снаружи
        run: curl -sS --max-time 15 https://api.ipify.org || true
      - name: Bybit без User-Agent
        run: |
          code=$(curl -s -o /tmp/a.txt -w '%{http_code}' --max-time 20 \
            "https://api.bybit.com/v5/market/time") || true
          echo "код: $code"; head -c 400 /tmp/a.txt; echo
      - name: Bybit с браузерным User-Agent
        run: |
          code=$(curl -s -o /tmp/b.txt -w '%{http_code}' --max-time 20 \
            -H 'User-Agent: Mozilla/5.0' "https://api.bybit.com/v5/market/time") || true
          echo "код: $code"; head -c 400 /tmp/b.txt; echo
