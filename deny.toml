# cargo-deny: уязвимости, дубли версий, источники.
#
# Лицензии здесь намеренно не проверяются: проект не распространяется бинарём,
# а красный билд из-за экзотической лицензии в третьем эшелоне зависимостей
# учит игнорировать красный билд. Включать, когда появится дистрибуция.

[advisories]
# Уязвимости — жёстко. Процесс по плану работает неделями без присмотра, и
# дыра в разборе кадра или в TLS стоит дороже любого неудобства.
yanked = "deny"

[bans]
# Дубли версий — предупреждение, а не отказ: сегодня их восемь пар, и почти
# все приходят из `hftbacktest`, то есть чинятся не нами. Смысл проверки —
# чтобы список не рос молча.
multiple-versions = "warn"
wildcards = "deny"

# Известные на сегодня пары. Каждая — чужая транзитивная зависимость, не наша
# небрежность; список ведётся, чтобы новую было видно на фоне старых.
skip = [
  { crate = "zstd@0.13.3" },       # наш 0.14, 0.13 тянет hftbacktest
  { crate = "zstd-safe@7.3.0" },   # то же самое, уровнем ниже
  { crate = "thiserror@1.0.69" },
  { crate = "syn@2.0.119" },
  { crate = "getrandom@0.2.17" },
  { crate = "getrandom@0.3.4" },
  { crate = "webpki-roots@0.26.11" },
]

[sources]
# Только crates.io. Зависимость из git или со своего зеркала — это то, чего
# в этом проекте быть не должно, и заметить её надо на CI, а не при аудите.
unknown-registry = "deny"
unknown-git = "deny"
