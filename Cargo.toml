[package]
name = "alpha"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures = "0.3"
chrono = "0.4"
# zdict_builder — только ради обучения словаря в examples/dict_probe.rs (замер 2026-09-15:
# словарь отклонён, 2-3 %); на работу коллектора фича не влияет и может быть снята.
zstd = { version = "0.14", features = ["zdict_builder"] }
# live тянет iceoryx2 и tokio крейта; он понадобится на шаге живого бота, не сейчас.
hftbacktest = { version = "0.9.4", default-features = false, features = ["backtest"] }
# Decision 12: подпись приватных запросов Bybit. Ключи только из переменных окружения.
hmac = "0.13"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

# Локальная копия крейта hftbacktest 0.9.4 с одним исправлением
# (`PartialFillExchange`: нога, исполненная ровно до нуля, оставалась в карте биржи
# и роняла прогон `InvalidOrderStatus` при следующей сделке по той же цене) —
# без неё модель очереди по объёму (`--queue-model prob:<n>`, F3/F8/F10) на живых
# сутках падает. Разбор и воспроизведение — docs/findings/hftbacktest-partialfill-fix-2026-09-20.md.
[patch.crates-io]
hftbacktest = { path = "vendor/hftbacktest" }
